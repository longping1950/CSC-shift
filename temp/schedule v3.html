<!DOCTYPE html>
<html>
	<head>
		<meta charset='utf-8'>
		<title>中鋼班表查詢</title>
		<link rel="shortcut icon" href="web/favicon.ico" type="image/x-icon">
		<link rel="icon" href="web/favicon.ico" type="image/x-icon">
		<style>
			body {
				display: flex;
				flex-direction: column;
				min-height: 100vh;
				background-color: #7394b5;
				font-family: Arial, sans-serif;
				font-size: 22px;
				margin: 0;
				padding: 20px;
			}
			
			span {
				white-space: pre;
			}

			footer {
				text-align: center;
			}

			.container {
				max-width: 1200px;
				margin: 0 auto;
				background-color: white;
				border-radius: 15px;
				padding: 30px;
				box-shadow: 0 0 20px rgba(0,0,0,0.1);
			}

			.content-wrapper {
				width: 100%;
				max-width: 800px;
				margin: 0 auto;
			}

			.search-bar {
				display: flex;
				align-items: center;
				gap: 20px;
				margin-bottom: 30px;
			}

			.linkbutton {
				background-color: #ecf0f1;
				color: #2c3e50;
				border: none;
				padding: 10px 20px;
				border-radius: 8px;
				font-size: 18px;
				cursor: pointer;
				transition: all 0.3s ease;
			}

			.linkbutton:hover {
				background-color: #bdc3c7;
				transform: scale(1.05);
			}

			.button-right {
				margin-left: auto;
			}

			.button-container {
				display: flex;
				margin-top: 20px;
			}

			input, select {
				font-size: 16px;
				padding: 8px 15px;
				border-radius: 8px;
				border: 1px solid #ddd;
			}
						
			/* 新增：CSS Grid 樣式 */
			#schedule-grid {
				width: 100%;
				max-width: 800px;
				margin: 0 auto;
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				border: 1px solid #ddd;
				border-radius: 8px;
				overflow: hidden;
				background-color: #f8f8f8;
			}

			.grid-cell {
				padding: 10px;
				text-align: center;
				border-bottom: 1px solid #ddd;
				border-right: 1px solid #ddd;
				background-color: white;
				font-size: 22px;
			}

			.grid-cell:last-child {
				border-right: none;
			}

			.grid-header {
				background-color: #3498db;
				color: white;
				padding: 12px;
				text-align: center;
				font-weight: bold;
				font-size: 22px;
				border-bottom: 2px solid #2c3e50;
			}

			.grid-title-header {
				grid-column: span 4;
				font-size: 40px;
			}

			.grid-row-striped {
				background-color: #f9f9f9;
			}

			.content-wrapper {
				flex-grow: 1;
			}

			.bottom {
				font-size: 22px;
				left: 0;
				width: 100%;
			}

			@media (max-width: 768px) {
				.container {
					padding: 15px;
				}
				
				input, select {
					font-size: 14px;
				}
				
				.grid-cell, .grid-header {
					padding: 8px;
				}
			}
		</style>
	</head>
	<body>
		<div class="content-wrapper">
			<div class="search-bar">
				<span>日期:</span>
				<input type="date" id="Date" value="" />
				<span>股別:</span>
				<select id="part">
					<option value=0 selected>A股</option>
					<option value=1>B股</option>
					<option value=2>C股</option>
					<option value=3>D股</option>
				</select>
				<button id="link1" class="linkbutton button-right" onclick="redirectToURL()">月輪班表</button>
			</div>
			<p></p>
			
			<div id="schedule-grid"></div>

			<p></p>

			<div class="button-container">
				<button id="up" class="linkbutton">上一週</button>
				<button id="down" class="linkbutton button-right">下一週</button>
			</div>
			
			<script>
				// 日期格式化函式
				function FormatDate(date) {
					const yyyy = date.getFullYear();
					const mm = String(date.getMonth() + 1).padStart(2, '0');
					const dd = String(date.getDate()).padStart(2, '0');
					const formattedDate = yyyy + '-' + mm + '-' + dd;
					document.getElementById('Date').value = formattedDate;
					return formattedDate;
				}

				const selectpart = document.getElementById('part');
				const startDateInput = document.getElementById('Date');
				const myTable = document.getElementById('schedule-grid');
				const partMemory =localStorage.getItem('partMemory');

				// 讀取網址中的日期和股別參數
				const urlParams = new URLSearchParams(window.location.search);
				const dateParam = urlParams.get('date');
				const partParam = urlParams.get('part');

				if (dateParam) {
					startDateInput.value = dateParam;
				} else {
					const today = new Date();
					FormatDate(today);
				}

				if (partParam) {
					selectpart.value = partParam;
				} else {
					if (partMemory) {
						part.value = partMemory;
					}
				}
				
				// 建立list
				let List = ["中","中","中","中","中","休","早","早","早","早","早","休","休","夜","夜","夜","夜","夜","休","休","中","中","中","中","中","休","早","早","早","早","早","休","休","夜","夜","夜","夜","夜","休","休"]
				let List1 = [["C/D","C","B/C","D","D","","B","B","C","C","B/C","","","B","B","B","D","D","","","C/D","C","B/C","D","D","","B","B","C","C","B/C","","","B","B","B","D","D","",""],["D/A","D","C/D","A","A","","C","C","D","D","C/D","","","C","C","C","A","A","","","D/A","D","C/D","A","A","","C","C","D","D","C/D","","","C","C","C","A","A","",""],["A/B","A","D/A","B","B","","D","D","A","A","D/A","","","D","D","D","B","B","","","A/B","A","D/A","B","B","","D","D","A","A","D/A","","","D","D","D","B","B","",""],["B/C","B","A/B","C","C","","A","A","B","B","A/B","","","A","A","A","C","C","","","B/C","B","A/B","C","C","","A","A","B","B","A/C","","","A","A","A","C","C","",""]]
				let List2 = [["","B/D","","B/C","B/C","","C/D","C/D","B/D","B/D","","","","","","","","","","","","B/D","","B/C","B/C","","C/D","C/D","B/D","B/D","","","","","","","","","",""],["","C/A","","C/D","C/D","","D/A","D/A","C/A","C/A","","","","","","","","","","","","C/A","","C/D","C/D","","D/A","D/A","C/A","C/A","","","","","","","","","",""],["","D/B","","D/A","D/A","","A/B","A/B","D/B","D/B","","","","","","","","","","","","D/B","","D/A","D/A","","A/B","A/B","D/B","D/B","","","","","","","","","",""],["","A/C","","A/B","A/B","","B/C","B/C","A/C","A/C","","","","","","","","","","","","A/C","","A/B","A/B","","B/C","B/C","A/C","A/C","","","","","","","","","",""]]
				
				function getOrdinalDate(date) {
					// 將日期轉換為 UNIX 時間戳
					const timestamp = Date.parse(date);
					// 將時間戳轉換成天數
					return Math.floor(timestamp / 86400000);
				}
				

				function redirectToURL() {
					window.location.href = "https://longping1950.github.io/CSC-shift/shift.html";
				}

				function gentable(name) {
					myTable.innerHTML = ''; // 清空舊內容
					
					const startDate = new Date(startDateInput.value);
					const selectedOption = selectpart.options[selectpart.selectedIndex];
					
					// 標題行
					const titleHeader = document.createElement('div');
					titleHeader.classList.add('grid-header', 'grid-title-header');
					titleHeader.textContent = `${selectedOption.text}請假查詢`;
					myTable.appendChild(titleHeader);

					// 表格標頭
					const headers = [`日期`, `班別`, `請假代理`, `半天`];
					headers.forEach(headerText => {
						const headerCell = document.createElement('div');
						headerCell.classList.add('grid-header');
						headerCell.textContent = headerText;
						myTable.appendChild(headerCell);
					});

					// 生成數據行
					const displayDate = new Date(startDate); // 使用一個副本來避免修改原始日期
					for (let i = 0; i < 7; i++) { // 7 行數據
						const ordinalDate = getOrdinalDate(displayDate);
						let nList = ordinalDate % 20;
						switch (selectedOption.value) {
							case '0': nList += 18;
							break;
							case '1': nList += 3;
							break;
							case '2': nList += 8;
							break;
							case '3': nList += 13;
							break;
						}
						
						const options = {weekday:"narrow"};

						const rowData = [
							displayDate.toLocaleDateString() + "(" + displayDate.toLocaleDateString("zh-TW", options) + ")",
							List[nList],
							List1[selectedOption.value][nList],
							List2[selectedOption.value][nList]
						];

						rowData.forEach(cellData => {
							const cell = document.createElement('div');
							cell.classList.add('grid-cell');
							cell.textContent = cellData;
							myTable.appendChild(cell);
						});
						
						displayDate.setDate(displayDate.getDate() + 1); // 日期遞增一天
					}
				}

				// 更新網址的函式
				function updateURL() {
					const newDate = startDateInput.value;
					const newPart = selectpart.value;
					localStorage.setItem('partMemory', newPart);
					window.location.href = `?date=${newDate}&part=${newPart}`;
				}

				// 建立表格
				gentable();
				
				// 日期觸發器
				startDateInput.addEventListener('change', updateURL);
				
				// 股別觸發器
				selectpart.addEventListener('change', updateURL);
				
				// 上週按鈕觸發器
				const upbutton = document.getElementById('up');
				upbutton.addEventListener('click', () => {
					let newDate = new Date(startDateInput.value);
					newDate.setDate(newDate.getDate() - 7);
					startDateInput.value = FormatDate(newDate);
					updateURL();
				});

				// 下週按鈕出發器
				const downbutton = document.getElementById('down');
				downbutton.addEventListener('click', () => {
					let newDate = new Date(startDateInput.value);
					newDate.setDate(newDate.getDate() + 7);
					startDateInput.value = FormatDate(newDate);
					updateURL();
				});
			
			</script>
		</div>
	</div>
	<footer class="bottom">
		<p>copyright &copy; 2025 longping.
		<a href="https://github.com/longping1950/CSC-shift">
			<img src="web/github-mark.png" alt="點擊前往專案" style="height: 24px; cursor: pointer;">
		</a>
		</p>
	</footer>
	</body>
</html>
