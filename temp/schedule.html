<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>加班查詢</title>
    
    <link rel="icon" href="web/favicon.ico">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configure Tailwind for Dark Mode -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151f32' }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: system-ui, -apple-system, "Microsoft JhengHei", sans-serif; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* iOS Instruction Animation */
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(5px); }
        }
        .animate-bounce-slow { animation: bounce-slow 2s infinite; }

        /* Animation for Modal */
        @keyframes slide-up {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up { animation: slide-up 0.3s ease-out forwards; }
    </style>
</head>
<body class="overflow-x-hidden"> <!-- 防止左右滾動 -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useLayoutEffect } = React;

        // ==========================================
        //  Internal Icons
        // ==========================================
        
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const ChevronLeft = (props) => <IconBase {...props}><path d="m15 18-6-6 6-6"/></IconBase>;
        const ChevronRight = (props) => <IconBase {...props}><path d="m9 18 6-6-6-6"/></IconBase>;
        const CalendarDays = (props) => <IconBase {...props}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></IconBase>;
        const ExternalLink = (props) => <IconBase {...props}><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></IconBase>;
        const X = (props) => <IconBase {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>;
        const Moon = (props) => <IconBase {...props}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></IconBase>;
        const Sun = (props) => <IconBase {...props}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></IconBase>;
        const Github = (props) => <IconBase {...props}><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></IconBase>;
        const ChevronDown = (props) => <IconBase {...props}><path d="m6 9 6 6 6-6"/></IconBase>;

        // ==========================================
        //  Logic Core
        // ==========================================

        const List = ["中","中","中","中","中","休","早","早","早","早","早","休","休","夜","夜","夜","夜","夜","休","休"];
        const List1 = [
            ["C/D","C","B/C","D","D","","B","B","C","C","B/C","","","B","B","B","D","D","",""],
            ["D/A","D","C/D","A","A","","C","C","D","D","C/D","","","C","C","C","A","A","",""],
            ["A/B","A","D/A","B","B","","D","D","A","A","D/A","","","D","D","D","B","B","",""],
            ["B/C","B","A/B","C","C","","A","A","B","B","A/B","","","A","A","A","C","C","",""]
        ];
        const List2 = [
            ["","B/D","","B/C","B/C","","C/D","C/D","B/D","B/D","","","","","","","","","",""],
            ["","C/A","","C/D","C/D","","D/A","D/A","C/A","C/A","","","","","","","","","",""],
            ["","D/B","","D/A","D/A","","A/B","A/B","D/B","D/B","","","","","","","","","",""],
            ["","A/C","","A/B","A/B","","B/C","B/C","A/C","A/C","","","","","","","","","",""]
        ];

        function getOrdinalDate(date) {
            const utcDate = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
            return Math.floor(utcDate / 86400000);
        }

        function getEFGShift(date, group) {
            const baseDate = new Date(2026, 0, 26);
            baseDate.setHours(0,0,0,0);
            
            const targetDate = new Date(date);
            targetDate.setHours(0,0,0,0);
            
            const dayOfWeek = targetDate.getDay(); 
            const diffToMon = (dayOfWeek + 6) % 7;
            const targetMonday = new Date(targetDate);
            targetMonday.setDate(targetDate.getDate() - diffToMon);

            const msPerWeek = 7 * 24 * 60 * 60 * 1000;
            const diffWeeks = Math.floor((targetMonday.getTime() - baseDate.getTime()) / msPerWeek);

            let cycle = diffWeeks % 3;
            if (cycle < 0) cycle += 3;

            const patterns = {
                'E': ['中', '早', '夜'],
                'F': ['早', '夜', '中'],
                'G': ['夜', '中', '早']
            };
            
            const shiftType = patterns[group][cycle];
            
            let isWorkDay = false;
            if (shiftType === '中' && dayOfWeek >= 1 && dayOfWeek <= 5) isWorkDay = true;
            else if (shiftType === '早' && dayOfWeek >= 1 && dayOfWeek <= 6) isWorkDay = true;
            else if (shiftType === '夜' && dayOfWeek >= 1 && dayOfWeek <= 5) isWorkDay = true;

            return isWorkDay ? shiftType : "休";
        }

        const SHIFT_STYLES = {
            '早': 'bg-[#9dd7db] text-[#005f6b] dark:bg-[#005f6b] dark:text-[#9dd7db] border border-[#005f6b]/20',
            '中': 'bg-[#ceb98d] text-[#5c450a] dark:bg-[#5c450a] dark:text-[#ceb98d] border border-[#5c450a]/20',
            '夜': 'bg-[#c6a1cf] text-[#4a1f5c] dark:bg-[#4a1f5c] dark:text-[#c6a1cf] border border-[#4a1f5c]/20',
            '休': 'bg-slate-100 text-slate-500 dark:bg-slate-700 dark:text-slate-400 border border-slate-200 dark:border-slate-600'
        };

        // ==========================================
        //  UI Components
        // ==========================================

        const Modal = ({ isOpen, onClose, data }) => {
            if (!isOpen || !data) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm transition-opacity" onClick={onClose}>
                    <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden transform transition-all scale-100 border dark:border-slate-700 animate-slide-up" onClick={e => e.stopPropagation()}>
                        <div className="bg-slate-50 dark:bg-slate-700/50 px-4 py-3 border-b border-slate-200 dark:border-slate-600 flex justify-between items-center">
                            <h3 className="text-lg font-semibold leading-6 text-slate-900 dark:text-white">詳細資訊</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-500 dark:hover:text-slate-300 focus:outline-none">
                                <X size={20} />
                            </button>
                        </div>

                        <div className="px-4 py-5 sm:p-6 space-y-4">
                            <div className="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                                <span className="text-sm font-medium text-slate-500 dark:text-slate-400">日期</span>
                                <span className="text-base font-bold text-slate-900 dark:text-white">{data.dateStr} ({data.dayName})</span>
                            </div>
                            
                            <div className="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                                <span className="text-sm font-medium text-slate-500 dark:text-slate-400">班別</span>
                                <span className={`text-base font-bold px-2 py-0.5 rounded ${SHIFT_STYLES[data.shiftText] || 'text-slate-900 dark:text-white'}`}>
                                    {data.shiftText === '休' ? '休假' : data.shiftText + '班'}
                                </span>
                            </div>
                            
                            <div className="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                                <span className="text-sm font-medium text-slate-500 dark:text-slate-400">請假代理</span>
                                <span className="text-base font-medium text-slate-900 dark:text-white">{data.agentText || '-'}</span>
                            </div>
                            
                            <div className="flex justify-between items-center pt-1">
                                <span className="text-sm font-medium text-slate-500 dark:text-slate-400">半天</span>
                                <span className="text-base font-medium text-slate-900 dark:text-white">{data.halfText || '-'}</span>
                            </div>
                        </div>

                        <div className="bg-slate-50 dark:bg-slate-700/30 px-4 py-3 sm:flex sm:flex-row-reverse">
                            <button type="button" onClick={onClose} className="inline-flex w-full justify-center rounded-md bg-white dark:bg-slate-700 px-3 py-2 text-sm font-semibold text-slate-900 dark:text-white shadow-sm ring-1 ring-inset ring-slate-300 dark:ring-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600 sm:mt-0 sm:w-auto">關閉</button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [dateInput, setDateInput] = useState(() => {
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            });
            const [selectedPart, setSelectedPart] = useState('0'); // '0' is A
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [modalData, setModalData] = useState({ isOpen: false, data: null });

            // Ref for scaling content
            const mainContainerRef = useRef(null);
            const contentRef = useRef(null);
            const [controlScale, setControlScale] = useState(1);
            const [contentHeight, setContentHeight] = useState('auto');

            useEffect(() => {
                try {
                    const savedTheme = localStorage.getItem('shift_theme_mode');
                    if (savedTheme === 'dark') setIsDarkMode(true);
                    else if (savedTheme === 'light') setIsDarkMode(false);
                    else if (window.matchMedia('(prefers-color-scheme: dark)').matches) setIsDarkMode(true);

                    const savedPart = localStorage.getItem('partMemory');
                    if (savedPart) setSelectedPart(savedPart);
                } catch (e) {}
            }, []);

            // Scale Calculation - Scaled entire content if width < 450px
            useEffect(() => {
                const handleResize = () => {
                    if (!mainContainerRef.current) return;
                    
                    const width = window.innerWidth;
                    const minWidth = 450; // 閾值設定為 450px
                    
                    if (width < minWidth) {
                        setControlScale(1.1 * width / minWidth);
                    } else {
                        setControlScale(1);
                    }
                };

                window.addEventListener('resize', handleResize);
                handleResize(); // Initial check
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            useLayoutEffect(() => {
                if (contentRef.current) {
                    if (controlScale < 1) {
                        setContentHeight(`${contentRef.current.offsetHeight * controlScale}px`);
                    } else {
                        setContentHeight('auto');
                    }
                }
            }, [controlScale, dateInput, selectedPart, isDarkMode]);

            const toggleDarkMode = () => {
                setIsDarkMode(prev => {
                    const newVal = !prev;
                    localStorage.setItem('shift_theme_mode', newVal ? 'dark' : 'light');
                    return newVal;
                });
            };

            const calculateSchedule = useMemo(() => {
                if (!dateInput) return [];
                const parts = dateInput.split('-');
                const selectedDate = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
                
                const dayOfWeek = selectedDate.getDay();
                const startDate = new Date(selectedDate);
                startDate.setDate(selectedDate.getDate() - dayOfWeek);

                const data = [];
                const displayDate = new Date(startDate);
                const partValue = selectedPart;

                for (let i = 0; i < 7; i++) {
                    let shiftText = "";
                    let agentText = "";
                    let halfText = "";

                    if (['0', '1', '2', '3'].includes(partValue)) {
                        const ordinalDate = getOrdinalDate(displayDate);
                        let nList = ordinalDate % 20;
                        let offset = 0;
                        if (partValue === '0') offset = 18;
                        if (partValue === '1') offset = 3;
                        if (partValue === '2') offset = 8;
                        if (partValue === '3') offset = 13;
                        
                        nList = (nList + offset) % 20;
                        if (nList < 0) nList += 20;

                        shiftText = List[nList];
                        const pIndex = parseInt(partValue);
                        agentText = List1[pIndex][nList];
                        halfText = List2[pIndex][nList];
                    } else {
                        shiftText = getEFGShift(displayDate, partValue);
                    }

                    const dateStr = `${displayDate.getMonth() + 1}/${displayDate.getDate()}`;
                    const fullDateStr = `${displayDate.getFullYear()}/${dateStr}`;
                    const dayName = ["日", "一", "二", "三", "四", "五", "六"][displayDate.getDay()];
                    
                    data.push({
                        dateObj: new Date(displayDate),
                        dateStr: dateStr,
                        fullDateStr: fullDateStr,
                        dayName: dayName,
                        shiftText: shiftText,
                        agentText: agentText,
                        halfText: halfText
                    });

                    displayDate.setDate(displayDate.getDate() + 1);
                }
                return data;
            }, [dateInput, selectedPart]);

            const changeWeek = (offset) => {
                const parts = dateInput.split('-');
                const d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
                d.setDate(d.getDate() + (offset * 7));
                setDateInput(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`);
            };

            const partNameMap = {
                '0': 'A股', '1': 'B股', '2': 'C股', '3': 'D股',
                'E': 'E股', 'F': 'F股', 'G': 'G股'
            };

            const handlePartChange = (e) => {
                setSelectedPart(e.target.value);
                localStorage.setItem('partMemory', e.target.value);
            };

            const currentYear = new Date().getFullYear();
            const startYear = 2024;
            const displayYear = currentYear > startYear ? `${startYear}-${currentYear}` : `${startYear}`;

            return (
                <div className={isDarkMode ? "dark" : ""}>
                    <div className="min-h-screen bg-slate-100 dark:bg-slate-900 p-2 md:p-4 font-sans text-slate-800 dark:text-slate-100 transition-colors duration-200 flex flex-col overflow-hidden">
                        
                        {/* Wrapper for Scaling */}
                        <div 
                            ref={mainContainerRef}
                            className="w-full flex justify-center origin-top transition-transform duration-200 flex-grow"
                            style={{ height: contentHeight }}
                        >
                            <div 
                                style={{
                                    width: controlScale < 1 ? '450px' : '100%',
                                    transform: controlScale < 1 ? `scale(${controlScale})` : 'none',
                                    transformOrigin: 'top center',
                                }}
                            >
                                <div ref={contentRef} className="max-w-4xl mx-auto space-y-6 w-full">
                                    
                                    {/* Header Card */}
                                    <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 transition-colors duration-200 overflow-hidden p-6">
                                        <div className="flex flex-row justify-between items-center gap-4 mb-6 whitespace-nowrap">
                                            <h1 className="text-2xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                                                <CalendarDays className="text-slate-600 dark:text-slate-300" />
                                                加班查詢
                                            </h1>
                                            
                                            <div className="flex items-center gap-2">
                                                <button onClick={toggleDarkMode} className="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors" title="切換深色模式">
                                                    {isDarkMode ? <Sun size={20} /> : <Moon size={20} />}
                                                </button>

                                                <a href="./shift.html" className="flex items-center gap-2 px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg transition-colors text-sm font-medium">
                                                    <ExternalLink size={16} />
                                                    班表查詢
                                                </a>
                                            </div>
                                        </div>

                                        {/* Control Bar */}
                                        <div className="flex flex-col md:flex-row gap-4 items-center justify-between bg-slate-50 dark:bg-slate-700/50 p-4 rounded-lg border border-slate-100 dark:border-slate-700/50">
                                            <div className="flex items-center gap-3 w-full md:w-auto">
                                                <label className="font-medium text-slate-600 dark:text-slate-300 whitespace-nowrap">日期:</label>
                                                <input 
                                                    type="date" 
                                                    value={dateInput}
                                                    onChange={(e) => setDateInput(e.target.value)}
                                                    className="w-full md:w-auto bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium shadow-sm text-slate-700 dark:text-slate-200"
                                                />
                                            </div>

                                            <div className="flex items-center gap-3 w-full md:w-auto">
                                                <label className="font-medium text-slate-600 dark:text-slate-300 whitespace-nowrap">股別:</label>
                                                <div className="relative w-full md:w-40">
                                                    <select 
                                                        value={selectedPart}
                                                        onChange={handlePartChange}
                                                        className="w-full appearance-none bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md px-3 py-2 pr-8 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium shadow-sm cursor-pointer text-slate-700 dark:text-slate-200"
                                                    >
                                                        <optgroup label="4班3輪">
                                                            <option value="0">A股</option>
                                                            <option value="1">B股</option>
                                                            <option value="2">C股</option>
                                                            <option value="3">D股</option>
                                                        </optgroup>
                                                        <optgroup label="3班3輪">
                                                            <option value="E">E股</option>
                                                            <option value="F">F股</option>
                                                            <option value="G">G股</option>
                                                        </optgroup>
                                                    </select>
                                                    <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500 dark:text-slate-400">
                                                        <ChevronDown size={16} />
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Schedule Content Card */}
                                    <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden transition-colors duration-200">
                                        <div className="p-4 bg-slate-50 dark:bg-slate-700/50 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                                            <h2 className="font-bold text-lg text-slate-700 dark:text-slate-200">{partNameMap[selectedPart]} - 班表內容</h2>
                                            <div className="flex gap-2">
                                                <button onClick={() => changeWeek(-1)} className="flex items-center gap-1 px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-md text-sm font-medium transition-colors shadow-sm">
                                                    <ChevronLeft size={16} /> 上週
                                                </button>
                                                <button onClick={() => changeWeek(1)} className="flex items-center gap-1 px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-md text-sm font-medium transition-colors shadow-sm">
                                                    下週 <ChevronRight size={16} />
                                                </button>
                                            </div>
                                        </div>
                                        
                                        <div className="overflow-hidden"> {/* 移除 overflow-x-auto 以防止滾動 */}
                                            <table className="w-full text-left border-collapse">
                                                <thead>
                                                    <tr className="bg-slate-100 dark:bg-slate-900/50 text-slate-600 dark:text-slate-400 text-sm uppercase tracking-wider">
                                                        <th className="px-6 py-4 font-semibold border-b border-slate-200 dark:border-slate-700 w-1/3 whitespace-nowrap">日期</th>
                                                        <th className="px-6 py-4 font-semibold border-b border-slate-200 dark:border-slate-700 text-center w-1/3 whitespace-nowrap">班別</th>
                                                        <th className="px-6 py-4 font-semibold border-b border-slate-200 dark:border-slate-700 text-center w-1/3 whitespace-nowrap">請假代理</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 dark:divide-slate-700">
                                                    {calculateSchedule.map((row, idx) => {
                                                        const isToday = row.dateObj.toDateString() === new Date().toDateString();
                                                        const dayNum = row.dateObj.getDay();
                                                        const dateColor = dayNum === 0 ? 'text-red-500 dark:text-red-400' : (dayNum === 6 ? 'text-blue-500 dark:text-blue-400' : 'text-slate-700 dark:text-slate-200');

                                                        return (
                                                            <tr 
                                                                key={idx} 
                                                                className={`group hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors cursor-pointer ${isToday ? 'bg-blue-50 dark:bg-blue-900/20' : ''}`}
                                                                onClick={() => setModalData({ isOpen: true, data: row })}
                                                            >
                                                                <td className="px-6 py-4 whitespace-nowrap">
                                                                    <div className="flex items-center gap-3">
                                                                        <span className={`font-bold text-lg ${dateColor}`}>{row.dateStr}</span>
                                                                        <span className="text-xs text-slate-500 dark:text-slate-400 font-medium px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 group-hover:bg-white dark:group-hover:bg-slate-600 transition-colors">{row.dayName}</span>
                                                                        {isToday && <span className="text-[10px] bg-blue-100 dark:bg-blue-900 text-blue-600 dark:text-blue-300 px-1.5 py-0.5 rounded font-bold">今天</span>}
                                                                    </div>
                                                                </td>
                                                                <td className="px-6 py-4 text-center">
                                                                    <span className={`inline-flex items-center justify-center px-3 py-1 rounded-md text-sm font-bold min-w-[60px] shadow-sm transition-all ${SHIFT_STYLES[row.shiftText]}`}>
                                                                        {row.shiftText === '休' ? '休假' : row.shiftText + '班'}
                                                                    </span>
                                                                </td>
                                                                <td className="px-6 py-4 text-center text-slate-600 dark:text-slate-400 font-medium">
                                                                    {row.agentText || '-'}
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                    
                                    {/* Footer (inside scaled content) */}
                                    <footer className="text-center text-slate-400 dark:text-slate-500 text-sm py-6">
                                        <p className="flex items-center justify-center gap-1">
                                            {displayYear} &copy; longping.cc
                                            <a href="https://github.com/longping1950/CSC-shift" className="ml-4 hover:text-blue-500 transition-colors" title="View on GitHub">
                                                <Github size={16} />
                                            </a>
                                        </p>
                                    </footer>
                                </div>
                            </div>
                        </div>

                        <Modal isOpen={modalData.isOpen} onClose={() => setModalData({ ...modalData, isOpen: false })} data={modalData.data} />
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
