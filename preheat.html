<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多台車預熱計時器</title>
    <style>
        /* 基礎樣式 */
        body {
            font-family: Arial, sans-serif;
            padding: 10px;
            background-color: #7394b5;
            margin: 0 auto; 
        }
        
        h1 {
            text-align: center;
            color: #333;
        }
        
        /* 新增：用於寬螢幕水平佈局的父容器 */
        .main-container {
            max-width: 1700px; 
            margin: 0 auto; /* 居中 */
        }
        

        /* 每個台車區塊的容器 */
        .car-container {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px; /* 核心修正: 確保單欄或雙欄最大寬度為 400px */
            width: 100%;     /* 核心修正: 確保在窄螢幕上能自適應 */
        }
        
        /* 標題 (CAR#1, CAR#2) */
        .car-title {
            font-size: 1.4em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid #007bff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Flexbox 佈局 */
        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap; 
        }
        
        /* 針對開始時間的特殊排版 */
        .start-time-group {
            border-bottom: 1px dashed #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        label {
            min-width: 70px; 
            font-weight: bold;
            color: #555;
            margin-right: 8px;
        }
        
        /* 數值輸入框樣式 */
        input[type="number"] {
            width: 55px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
            text-align: center;
            transition: opacity 0.3s; 
        }
        
        /* 數值輸入框禁用時的樣式 */
        input[type="number"]:disabled {
            background-color: #e9ecef;
            opacity: 0.6;
        }
        
        /* 開始時間輸入框樣式 (datetime-local) */
        input[type="datetime-local"] {
            display: inline-block !important; 
            width: 150px; 
            margin-right: 5px;
            padding: 8px;
            font-size: 0.9em;
        }
        
        /* 顯示設定時間的文字樣式 */
        .start-time-display {
            font-size: 1.1em;
            font-weight: bold;
            color: #007bff; 
            margin-right: 15px;
            min-width: 60px;
        }

        button {
            padding: 8px 10px;
            margin-left: 5px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: #f8f8f8;
            flex-shrink: 0; 
            transition: opacity 0.3s; 
        }
        button.add-btn {
            background-color: #e0f7fa; 
            border-color: #b2ebf2;
            font-weight: bold;
            padding: 6px 8px; 
        }
         /* 增加按鈕禁用時的樣式 */
        button.add-btn:disabled {
            background-color: #f0f0f0;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        button.reset-btn {
            background-color: #ffdddd;
            border-color: #ffaaaa;
            color: #d9534f;
            font-weight: bold;
            margin-left: auto; 
        }

        /* 倒數顯示樣式 */
        .countdown-display {
            font-size: 1.3em; 
            color: #d9534f;
            font-weight: bold;
            min-width: 60px;
            text-align: right;
            margin-right: 15px;
        }
        
        /* 總時間基礎樣式 */
        .total-time-display {
            font-size: 1.5em; 
            font-weight: bold;
            margin-top: 5px;
            padding: 5px 0;
        }
        
        /* === 總時長顏色狀態 === */
        .time-alert-red { color: #dc3545; }
        .time-alert-green { color: #28a745; }
        /* ======================== */
        
        /* 閃爍樣式 */
        .flashing {
            animation: blinker 1s linear infinite;
            color: red !important;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
        /* 輔助文字 */
        .unit-text {
            font-size: 0.8em; 
            color: gray;
            margin-right: 5px; 
        }
        
        /* --- 模態警報樣式 (不變) --- */
        .modal {
            display: none; 
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4); 
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto; 
            padding: 20px;
            border: 5px solid red;
            width: 80%; 
            max-width: 300px;
            text-align: center;
            border-radius: 10px;
            animation: modal-flash 0.5s infinite alternate; 
        }
        
        @keyframes modal-flash {
            from { border-color: red; box-shadow: 0 0 20px red; }
            to { border-color: darkred; box-shadow: 0 0 10px darkred; }
        }

        .modal-title {
            color: red;
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .modal-countdown {
            color: darkred;
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .modal-close-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }
        
        /* === 桌面版佈局 (寬度 > 850px) === */
        @media (min-width: 850px) {
            .main-container {
                display: flex;
                justify-content: center; /* 置中兩欄 */
                gap: 20px; 
                max-width: 840px; /* 約等於 400px * 2 + 20px gap */
            }

            .car-container {
                /* 繼承 max-width: 400px; */
                width: 400px; /* 確保在 flex 容器中為 400px */
                min-width: 400px; /* 確保不會縮小 */
            }
        }
        /* ================================== */
    </style>
</head>
<body>
    <audio id="alarm-audio" loop preload="auto">
        <source src="web/alarm.mp3" type="audio/mpeg"> 
        Your browser does not support the audio element.
    </audio>

    <h1>台車預熱計時系統</h1>
    
    <div class="main-container">
    
        <div id="car-1" class="car-container">
            <div class="car-title">
                <span>CAR#1</span>
                <button class="reset-btn" onclick="resetCar('1')">重置</button>
            </div>
            
            <div class="input-group">
                <label for="car-number-1">車號:</label>
                <input type="number" id="car-number-1" min="00" max="99" maxlength="2" value="" onchange="saveCarNumber('1')">
            </div>

            <div class="input-group start-time-group">
                <label>開始時間:</label>
                <span id="start-time-display-1" class="start-time-display">--:--</span>
                <button onclick="setCurrentTime('1')">開始預熱</button>
                <input type="datetime-local" id="start-time-1" onchange="updateStartTime('1')">
            </div>
            
            <div class="input-group">
                <label>升中火:</label>
                <span id="countdown-display-medium-1" class="countdown-display">--:--</span>
                <input type="number" id="set-duration-medium-1" step="0.1" min="0" value="1.0" onchange="saveAndUpdateTimer('1')"> 
                <span class="unit-text">(小時)</span>
                <button class="add-btn" id="add-btn-medium-1" onclick="adjustDuration('medium', 5, '1')">+5分</button>
            </div>

            <div class="input-group">
                <label>升大火:</label>
                <span id="countdown-display-high-1" class="countdown-display">--:--</span>
                <input type="number" id="set-duration-high-1" step="0.1" min="0" value="1.0" onchange="saveAndUpdateTimer('1')"> 
                <span class="unit-text">(小時)</span>
                <button class="add-btn" id="add-btn-high-1" onclick="adjustDuration('high', 5, '1')">+5分</button>
            </div>

            <div class="input-group">
                <label>轉保溫:</label>
                <span id="countdown-display-keepwarm-1" class="countdown-display">--:--</span>
                <input type="number" id="set-duration-keepwarm-1" step="0.1" min="0" value="1.0" onchange="saveAndUpdateTimer('1')"> 
                <span class="unit-text">(小時)</span>
                <button class="add-btn" id="add-btn-keepwarm-1" onclick="adjustDuration('keepwarm', 5, '1')">+5分</button>
            </div>

            <div class="input-group">
                <label>預熱總時長:</label>
                <span id="total-time-1" class="total-time-display time-alert-red">--:--</span>
            </div>
        </div>
        
        <div id="car-2" class="car-container">
            <div class="car-title">
                <span>CAR#2</span>
                <button class="reset-btn" onclick="resetCar('2')">重置</button>
            </div>

            <div class="input-group">
                <label for="car-number-2">車號:</label>
                <input type="number" id="car-number-2" min="00" max="99" maxlength="2" value="" onchange="saveCarNumber('2')">
            </div>

            <div class="input-group start-time-group">
                <label>開始時間:</label>
                <span id="start-time-display-2" class="start-time-display">--:--</span>
                <button onclick="setCurrentTime('2')">開始預熱</button>
                <input type="datetime-local" id="start-time-2" onchange="updateStartTime('2')">
            </div>
            
            <div class="input-group">
                <label>升中火:</label>
                <span id="countdown-display-medium-2" class="countdown-display">--:--</span>
                <input type="number" id="set-duration-medium-2" step="0.1" min="0" value="1.0" onchange="saveAndUpdateTimer('2')"> 
                <span class="unit-text">(小時)</span>
                <button class="add-btn" id="add-btn-medium-2" onclick="adjustDuration('medium', 5, '2')">+5分</button>
            </div>

            <div class="input-group">
                <label>升大火:</label>
                <span id="countdown-display-high-2" class="countdown-display">--:--</span>
                <input type="number" id="set-duration-high-2" step="0.1" min="0" value="1.0" onchange="saveAndUpdateTimer('2')"> 
                <span class="unit-text">(小時)</span>
                <button class="add-btn" id="add-btn-high-2" onclick="adjustDuration('high', 5, '2')">+5分</button>
            </div>

            <div class="input-group">
                <label>轉保溫:</label>
                <span id="countdown-display-keepwarm-2" class="countdown-display">--:--</span>
                <input type="number" id="set-duration-keepwarm-2" step="0.1" min="0" value="1.0" onchange="saveAndUpdateTimer('2')"> 
                <span class="unit-text">(小時)</span>
                <button class="add-btn" id="add-btn-keepwarm-2" onclick="adjustDuration('keepwarm', 5, '2')">+5分</button>
            </div>

            <div class="input-group">
                <label>預熱總時長:</label>
                <span id="total-time-2" class="total-time-display time-alert-red">--:--</span>
            </div>
        </div>
        
    </div> <div id="alertModal" class="modal">
        <div class="modal-content">
            <div id="modal-title" class="modal-title"></div>
            <div id="modal-countdown" class="modal-countdown"></div>
            <button class="modal-close-btn" onclick="closeAlertModal()">關閉 / 已處理</button>
        </div>
    </div>


    <script>
        // --- 核心變數結構化 ---
        const MS_PER_SECOND = 1000;
        const MS_PER_MINUTE = 60 * MS_PER_SECOND;
        const MS_PER_HOUR = 3600 * MS_PER_SECOND;
        const MINUTES_TO_HOURS = 1 / 60; 
        const THREE_HOURS_IN_MS = 3 * MS_PER_HOUR; 
        
        // --- 新增常數: 超時 5 分鐘的毫秒數 (用於抑制陳舊警報) ---
        const STALE_ALERT_THRESHOLD_MS = -5 * MS_PER_MINUTE; 
        
        let activeAlert = null; 
        let modalTimerInterval = null; 

        const carStates = {
            '1': {
                timerInterval: null,
                alertSentMedium: false,
                alertSentHigh: false,
                alertSentKeepWarm: false,
            },
            '2': {
                timerInterval: null,
                alertSentMedium: false,
                alertSentHigh: false,
                alertSentKeepWarm: false,
            }
        };
        
        const modal = document.getElementById('alertModal');
        const modalTitle = document.getElementById('modal-title');
        const modalCountdown = document.getElementById('modal-countdown');
        const alarmAudio = document.getElementById('alarm-audio');


        // --- Cookie 處理函數 (不變) ---
        function setCookie(name, value, days = 365) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * MS_PER_HOUR));
            const expires = "; expires=" + date.toUTCString();
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        function eraseCookie(name) {
            document.cookie = name + '=; Max-Age=-99999999; path=/';
        }

        /** 根據台車編號獲取 ID 字串 */
        function getId(idBase, carId) {
            return idBase + '-' + carId;
        }

        /** 播放警報音效 */
        function playAlertSound() {
            try {
                alarmAudio.currentTime = 0;
                alarmAudio.play().catch(e => console.error("無法自動播放音效，需要使用者互動:", e));
            } catch (e) {
                console.error("音訊播放錯誤:", e);
            }
        }
        
        /** 停止警報音效 */
        function stopAlertSound() {
            alarmAudio.pause();
            alarmAudio.currentTime = 0;
        }
        
        /** 更新模態視窗中的超時時間顯示 */
        function updateModalCountdown(remainingMs) {
            if (remainingMs <= 0) {
                // Calculate overdue minutes
                const overdueMinutes = Math.ceil(Math.abs(remainingMs) / MS_PER_MINUTE);
                modalCountdown.textContent = `已超時 ${overdueMinutes} 分`;
            } else {
                const totalMinutes = Math.floor(remainingMs / MS_PER_MINUTE);
                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;
                
                const countdownDisplay = 
                    String(hours).padStart(2, '0') + ':' + 
                    String(minutes).padStart(2, '0');
                
                modalCountdown.textContent = `剩餘: ${countdownDisplay}`; 
            }
        }

        /** 顯示警報模態視窗 */
        function showAlertModal(carId, stage, endTimeMs) {
            const carNumber = document.getElementById(getId('car-number', carId)).value || 'N/A';
            let stageTitle = '';
            
            if (stage === 'medium') { stageTitle = '升中火'; }
            else if (stage === 'high') { stageTitle = '升大火'; }
            else if (stage === 'keepwarm') { stageTitle = '轉保溫'; }
            
            modalTitle.textContent = `CAR#${carId} (${carNumber}) - ${stageTitle} ！`;
            
            const initialRemainingMs = endTimeMs - new Date().getTime();
            updateModalCountdown(initialRemainingMs); 
            
            modal.style.display = 'block';
            playAlertSound();
            
            activeAlert = { carId, stage, endTimeMs };
            
            if (modalTimerInterval) {
                clearInterval(modalTimerInterval);
            }
            
            modalTimerInterval = setInterval(() => {
                const now = new Date().getTime();
                const newRemainingMs = activeAlert.endTimeMs - now;
                updateModalCountdown(newRemainingMs);
            }, 1000);
        }

        /** 關閉警報模態視窗 */
        function closeAlertModal() {
            if (modalTimerInterval) {
                clearInterval(modalTimerInterval);
                modalTimerInterval = null;
            }
            
            if (activeAlert) {
                // 在 carStates 中設置該階段的 alertSent 為 true (代表警報已處理過)
                const state = carStates[activeAlert.carId];
                const stage = activeAlert.stage;
                const capitalizedStage = stage.charAt(0).toUpperCase() + stage.slice(1);
                state[`alertSent${capitalizedStage}`] = true;
                
                activeAlert = null;
            }
            stopAlertSound();
            modal.style.display = 'none';
        }


        /** 3. 儲存設定並自動啟動/更新計時器 */
        function saveAndUpdateTimer(carId) {
            const startTime = document.getElementById(getId('start-time', carId)).value; 
            const durationMedium = document.getElementById(getId('set-duration-medium', carId)).value;
            const durationHigh = document.getElementById(getId('set-duration-high', carId)).value;
            const durationKeepWarm = document.getElementById(getId('set-duration-keepwarm', carId)).value;

            setCookie(`car_${carId}_startTime`, startTime);
            setCookie(`car_${carId}_durationMedium`, durationMedium);
            setCookie(`car_${carId}_durationHigh`, durationHigh);
            setCookie(`car_${carId}_durationKeepWarm`, durationKeepWarm);

            autoStartTimer(carId);
        }

        /** 4. 啟動/更新單一台車的所有計時器 */
        function autoStartTimer(carId) {
            const state = carStates[carId];
            
            clearInterval(state.timerInterval); 
            
            // 重設提醒狀態 (允許下次歸零時彈窗)
            state.alertSentMedium = false;
            state.alertSentHigh = false;
            state.alertSentKeepWarm = false;
            
            const startTimeInput = document.getElementById(getId('start-time', carId)).value;

            if (!startTimeInput) {
                // 清空顯示和閃爍
                document.getElementById(getId('total-time', carId)).textContent = '--:--';
                document.getElementById(getId('countdown-display-medium', carId)).textContent = '--:--';
                document.getElementById(getId('countdown-display-high', carId)).textContent = '--:--';
                document.getElementById(getId('countdown-display-keepwarm', carId)).textContent = '--:--';
                document.getElementById(getId('countdown-display-medium', carId)).classList.remove('flashing');
                document.getElementById(getId('countdown-display-high', carId)).classList.remove('flashing');
                document.getElementById(getId('countdown-display-keepwarm', carId)).classList.remove('flashing');
                return;
            }
            
            updateAllTimers(carId);
            state.timerInterval = setInterval(() => updateAllTimers(carId), 1000); 
        }

        /** 5. 主更新函數：計算總時長和三個倒數計時 */
        function updateAllTimers(carId) {
            const startTimeInput = document.getElementById(getId('start-time', carId)).value; 
            const now = new Date(); 
            
            if (!startTimeInput) return; 

            let startTime = new Date(startTimeInput);
            
            const elapsedMs = now.getTime() - startTime.getTime();
            
            if (elapsedMs < 0) {
                updateTotalTimeDisplay(0, carId);
            } else {
                updateTotalTimeDisplay(elapsedMs, carId);
            }
            
            const durationMediumHours = parseFloat(document.getElementById(getId('set-duration-medium', carId)).value);
            const durationHighHours = parseFloat(document.getElementById(getId('set-duration-high', carId)).value);
            const durationKeepWarmHours = parseFloat(document.getElementById(getId('set-duration-keepwarm', carId)).value);

            const endTimeMedium = startTime.getTime() + (durationMediumHours * MS_PER_HOUR);
            const endTimeHigh = endTimeMedium + (durationHighHours * MS_PER_HOUR);
            const endTimeKeepWarm = endTimeHigh + (durationKeepWarmHours * MS_PER_HOUR);

            checkCountdownAndAlert('medium', endTimeMedium, now.getTime(), carId, carStates[carId]);
            checkCountdownAndAlert('high', endTimeHigh, now.getTime(), carId, carStates[carId]);
            checkCountdownAndAlert('keepwarm', endTimeKeepWarm, now.getTime(), carId, carStates[carId]);
        }

        /**
         * 檢查倒數狀態並處理提醒
         */
        function checkCountdownAndAlert(stage, endTimeMs, currentTimeMs, carId, state) {
            let remainingMs = endTimeMs - currentTimeMs;
            const displayId = getId(`countdown-display-${stage}`, carId);
            const element = document.getElementById(displayId);
            
            const durationInput = document.getElementById(getId(`set-duration-${stage}`, carId));
            const addButton = document.getElementById(getId(`add-btn-${stage}`, carId)); 
            
            const capitalizedStage = stage.charAt(0).toUpperCase() + stage.slice(1);
            let alertFlag = state[`alertSent${capitalizedStage}`];
            
            // 核心: 判斷顯示分鐘數是否為 0
            const totalMinutes = Math.floor(remainingMs / MS_PER_MINUTE);

            if (totalMinutes <= 0) { 
                // 1. 歸零時鎖定輸入和按鈕
                durationInput.disabled = true;
                addButton.disabled = true;
                
                // 2. 顯示並【永遠閃爍】
                element.textContent = '00:00';
                element.classList.add('flashing'); 
                
                // 3. 警報彈窗: 
                // 條件 1: 警報未被處理過 (!alertFlag)
                // 條件 2: 剩餘時間尚未超時過久 (remainingMs > STALE_ALERT_THRESHOLD_MS)
                // 條件 3: 沒有其他警報正在顯示 (!activeAlert)
                if (!alertFlag && remainingMs > STALE_ALERT_THRESHOLD_MS) {
                   if (!activeAlert) { 
                       showAlertModal(carId, stage, endTimeMs); 
                   }
                }

            } else {
                // 倒數中 (totalMinutes > 0)
                
                // 1. 確保輸入和按鈕已啟用
                durationInput.disabled = false;
                addButton.disabled = false;

                // 2. 顯示倒數時間
                element.classList.remove('flashing');
                
                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;

                const countdownDisplay = 
                    String(hours).padStart(2, '0') + ':' + 
                    String(minutes).padStart(2, '0');
                
                element.textContent = countdownDisplay;
            }
        }
        
        // --- 其他輔助函數 (保持不變) ---
        function setCurrentTime(carId) {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const datetimeString = `${year}-${month}-${day}T${hours}:${minutes}`;

            document.getElementById(getId('start-time', carId)).value = datetimeString;
            document.getElementById(getId('start-time-display', carId)).textContent = `${hours}:${minutes}`;
            
            saveAndUpdateTimer(carId);
        }

        function updateStartTime(carId) {
            const timeInput = document.getElementById(getId('start-time', carId));
            const datetimeValue = timeInput.value;
            
            if (datetimeValue) {
                const timePart = datetimeValue.split('T')[1]; 
                document.getElementById(getId('start-time-display', carId)).textContent = timePart || '--:--';
            } else {
                document.getElementById(getId('start-time-display', carId)).textContent = '--:--';
            }
            
            saveAndUpdateTimer(carId);
        }
        
        function saveCarNumber(carId) {
            const carNumber = document.getElementById(getId('car-number', carId)).value;
            setCookie(`car_${carId}_carNumber`, carNumber);
        }


        function adjustDuration(stage, minutes, carId) {
            const inputId = getId(`set-duration-${stage}`, carId);
            const inputElement = document.getElementById(inputId);
            
            let currentHours = parseFloat(inputElement.value) || 0;
            const hoursToAdd = minutes * MINUTES_TO_HOURS; 
            
            let newHours = currentHours + hoursToAdd;
            
            inputElement.value = newHours.toFixed(1); 
            
            saveAndUpdateTimer(carId);
        }
        
        function updateTotalTimeDisplay(elapsedMs, carId) {
            const totalElement = document.getElementById(getId('total-time', carId));

            const totalMinutes = Math.floor(elapsedMs / MS_PER_MINUTE);
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;

            const totalTimeDisplay = 
                String(hours).padStart(2, '0') + ':' + 
                String(minutes).padStart(2, '0');
            
            totalElement.textContent = totalTimeDisplay;
            
            if (elapsedMs < THREE_HOURS_IN_MS) {
                totalElement.classList.remove('time-alert-green');
                totalElement.classList.add('time-alert-red');
            } else {
                totalElement.classList.remove('time-alert-red');
                totalElement.classList.add('time-alert-green');
            }
        }

        function resetCar(carId) {
            if (!confirm(`確定要重置 CAR#${carId} 嗎？`)) {
                return;
            }
            
            const state = carStates[carId];
            
            clearInterval(state.timerInterval);
            state.timerInterval = null;

            state.alertSentMedium = false;
            state.alertSentHigh = false;
            state.alertSentKeepWarm = false;

            // 清除 DOM 元素值
            document.getElementById(getId('car-number', carId)).value = '';
            document.getElementById(getId('start-time', carId)).value = '';
            document.getElementById(getId('start-time-display', carId)).textContent = '--:--';
            document.getElementById(getId('set-duration-medium', carId)).value = '1.0'; 
            document.getElementById(getId('set-duration-high', carId)).value = '1.0';
            document.getElementById(getId('set-duration-keepwarm', carId)).value = '1.0';
            
            // 清空顯示和閃爍
            document.getElementById(getId('total-time', carId)).textContent = '--:--';
            document.getElementById(getId('total-time', carId)).classList.remove('time-alert-red', 'time-alert-green');
            document.getElementById(getId('countdown-display-medium', carId)).textContent = '--:--';
            document.getElementById(getId('countdown-display-high', carId)).textContent = '--:--';
            document.getElementById(getId('countdown-display-keepwarm', carId)).textContent = '--:--';
            document.getElementById(getId('countdown-display-medium', carId)).classList.remove('flashing');
            document.getElementById(getId('countdown-display-high', carId)).classList.remove('flashing');
            document.getElementById(getId('countdown-display-keepwarm', carId)).classList.remove('flashing');
            
            // 重新啟用所有輸入和按鈕
            const stages = ['medium', 'high', 'keepwarm'];
            stages.forEach(stage => {
                const durationInput = document.getElementById(getId(`set-duration-${stage}`, carId));
                const addButton = document.getElementById(getId(`add-btn-${stage}`, carId));
                if(durationInput) durationInput.disabled = false;
                if(addButton) addButton.disabled = false;
            });
            
            // 清除所有相關 Cookie
            eraseCookie(`car_${carId}_startTime`);
            eraseCookie(`car_${carId}_durationMedium`);
            eraseCookie(`car_${carId}_durationHigh`);
            eraseCookie(`car_${carId}_durationKeepWarm`);
            eraseCookie(`car_${carId}_carNumber`);

            // 如果有彈窗正在顯示，且屬於當前重置的車號，則關閉
            if (activeAlert && activeAlert.carId === carId) {
                closeAlertModal(); 
            }
        }

        function loadCarState(carId) {
            const startTime = getCookie(`car_${carId}_startTime`);
            const durationMedium = getCookie(`car_${carId}_durationMedium`);
            const durationHigh = getCookie(`car_${carId}_durationHigh`);
            const durationKeepWarm = getCookie(`car_${carId}_durationKeepWarm`);
            const carNumber = getCookie(`car_${carId}_carNumber`);
            
            if (durationMedium) document.getElementById(getId('set-duration-medium', carId)).value = parseFloat(durationMedium).toFixed(1);
            if (durationHigh) document.getElementById(getId('set-duration-high', carId)).value = parseFloat(durationHigh).toFixed(1);
            if (durationKeepWarm) document.getElementById(getId('set-duration-keepwarm', carId)).value = parseFloat(durationKeepWarm).toFixed(1);
            
            if (carNumber) document.getElementById(getId('car-number', carId)).value = carNumber;

            if (startTime) {
                document.getElementById(getId('start-time', carId)).value = startTime;
                
                const timePart = startTime.split('T')[1]; 
                document.getElementById(getId('start-time-display', carId)).textContent = timePart || '--:--';
                
                autoStartTimer(carId);
            }
        }


        document.addEventListener('DOMContentLoaded', () => {
            ['1', '2'].forEach(loadCarState);
            
            window.onclick = function(event) {
                if (event.target === modal) {
                    // Do nothing, force user to click the close button
                }
            }
        });
    </script>

</body>
</html>
