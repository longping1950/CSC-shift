<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常用工具</title>
    <link rel="shortcut icon" href="web/favicon.ico" type="image/x-icon">
    <link rel="icon" href="web/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        html, body {
            height: 100%; 
        }
        body {
            font-family: Arial, sans-serif;
            padding: 10px;
            background-color: #7394b5;
            margin: 0 auto; 
            
            /* Footer 置底核心設定 */
            display: flex;
            flex-direction: column;
            min-height: 100vh; 
        }

        /* === 3. Accordion (下拉式開關) 樣式 === */
        .combined-main-container {
            max-width: 1300px; /* 容納 weight.html 的寬版雙欄佈局 (1200px + padding) */
            margin: 0 auto;
            flex-grow: 1; 
            width: 100%;
            padding: 10px;
            min-width:450px;
        }

        .accordion-item {
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            background-color: #fff;
        }

        .accordion-header {
            background-color: #f0f0f0;
            font-size: 2em;
            padding: 15px;
            cursor: pointer;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        /* 展開時移除底下的圓角 */
        .accordion-item.active .accordion-header {
            border-radius: 10px 10px 0 0;
        }

        .accordion-header .toggle-icon {
            font-weight: bold;
            transition: transform 0.3s;
            margin-left: 20px;
            color: #007bff;
        }

        .accordion-item.active .toggle-icon {
            transform: rotate(180deg);
        }

        .accordion-content {
            display: none; /* 預設隱藏 */
            padding: 20px;
            border-top: 1px solid #ccc;
            background-color: #fff;
            border-radius: 0 0 10px 10px;
        }
        
        /* 確保內容區塊內部的元素不會繼承到 body 的背景色 */
        .accordion-content > div {
            padding: 0;
            margin: 0 auto;
            background-color: transparent;
        }
        
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between; 
            margin: 0 auto 20px auto; 
            max-width: 840px; 
            width: 100%;
            padding: 0 10px;
            flex-shrink: 0; 
        }

        .volume-control {
            width: 70px; 
            margin-left: 30px;
            flex-shrink: 0;
            color: #333;
            font-weight: bold;
        }
        
        .volume-control label {
            margin-bottom: 3px; 
            
        }

        .header-content {
            flex-grow: 1; 
            text-align: center;
        }
        
        .main-container {
            max-width: 1000px; 
            margin: 0 auto; 
            flex-grow: 1; 
            width: 100%;
        }
        
        footer {
            text-align: center;
            padding: 10px 0;
            margin-top: 20px; 
            flex-shrink: 0; 
        }

        .github-logo {
            height: 24px;
            cursor: pointer;
        }

        .car-container {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 400px; 
            height: 360px;
            margin: 0 auto;
        }
        
        .car-title {
            font-size: 1.4em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid #007bff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap; 
        }
        
        .start-time-group {
            border-bottom: 1px dashed #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        label {
            min-width: 70px; 
            font-weight: bold;
            color: #555;
            margin-right: 8px;
        }
        
        input[type="number"] {
            width: 55px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
            text-align: center;
            transition: opacity 0.3s; 
        }
        
        input[type="number"]:disabled {
            background-color: #e9ecef;
            opacity: 0.6;
        }
        
        input[type="datetime-local"] {
            display: inline-block !important; 
            width: 200px; 
            margin-right: 5px;
            padding: 8px;
            font-size: 0.9em;
        }
        
        .start-time-display {
            font-size: 1.1em;
            font-weight: bold;
            color: #007bff; 
            margin-right: 15px;
            min-width: 60px;
        }

        button {
            padding: 8px 10px;
            margin-left: 5px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: #f8f8f8;
            flex-shrink: 0; 
            transition: opacity 0.3s; 
        }
        button.add-btn {
            background-color: #e0f7fa; 
            border-color: #b2ebf2;
            font-weight: bold;
            padding: 6px 8px; 
        }
         
        button.add-btn:disabled {
            background-color: #f0f0f0;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        button.reset-btn {
            background-color: #ffdddd;
            border-color: #ffaaaa;
            color: #d9534f;
            font-weight: bold;
            margin-left: auto; 
        }
        
        .car-number-group button {
            margin-left: auto; 
        }


        .countdown-display {
            font-size: 1.3em; 
            font-weight: bold;
            min-width: 60px;
            text-align: right;
            margin-right: 15px;
        }
        
        /* 倒數計時 - 綠色 (>= 5 分鐘) */
        .time-safe {
            color: #333; 
        }
        
        /* 倒數計時 - 警示色 (< 5 分鐘或歸零) */
        .time-warning {
            color: #d9534f; 
        }
        
        /* 總時長顯示容器 */
        .total-time-display {
            font-size: 2.5em; 
            font-weight: bold;
            margin-top: 5px;
            padding: 5px 0;
            /* 必須設定為 inline-flex 才能讓內容物保持一行並應用顏色 */
            display: inline-flex; 
            align-items: center; 
        }
        
        /* === 總時長顏色狀態 (針對數字) === */
        .total-time-alert-red { color: #dc3545; }
        .total-time-alert-green { color: #28a745; }
        
        /* 總時長閃爍樣式容器 (僅影響冒號) */
        .total-time-display .colon.flashing-colon {
            animation: blink-colon 1s step-end infinite;
        }
        
        /* 閃爍動畫，讓冒號在顏色和透明度間切換 */
        @keyframes blink-colon {
            50% { opacity: 0; } 
        }
        /* ======================== */
        
        /* 歸零或超時閃爍 (已取消) */
        .flashing {
            color: red !important;
        }

        .unit-text {
            font-size: 0.8em; 
            color: gray;
            margin-right: 5px; 
        }
        
        /* --- 模態警報樣式 (不變) --- */
        .modal {
            display: none; 
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4); 
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto; 
            padding: 20px;
            border: 5px solid red;
            width: 80%; 
            max-width: 300px;
            text-align: center;
            border-radius: 10px;
            animation: modal-flash 0.5s infinite alternate; 
        }
        
        @keyframes modal-flash {
            from { border-color: red; box-shadow: 0 0 20px red; }
            to { border-color: darkred; box-shadow: 0 0 10px darkred; }
        }

        .modal-title {
            color: red;
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .modal-countdown {
            color: darkred;
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .modal-close-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        .calculator-container {
            display: flex;
            flex-wrap: wrap;
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 30px;
            max-width: 1200px; /* 雙欄寬度 */
            margin: 0 auto;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* Left side: Inputs and calculations */
        .input-section {
            padding-right: 30px;
            width: 550px; 
            max-width: 550px;
            min-width: 550px;
        }

        /* Right side: Chart */
        .chart-section {
            padding-left: 30px;
            text-align: center;
            width: 550px;
            max-width: 550px;
            min-width: 300px;
        }

        /* === 桌面版佈局 (寬度 > 1180px) === */
        @media (min-width: 850px) {
            .main-container {
                display: flex;
                justify-content: center; 
                gap: 20px; 
                max-width: 840px; 
            }

            .car-container {
                width: 400px; 
                min-width: 400px; 
            }
        }

        @media (max-width: 1177px) {
            .calculator-container {
                flex-direction: column;
                max-width: 600px; /* 單欄寬度 */
                padding: 20px;
            }

            .input-section {
                border-right: none;
                padding-right: 0;
                padding-bottom: 20px;
                min-width: unset;
                width: 100%;
                max-width: 100%;
            }

            .chart-section {
                padding-left: 0;
                padding-top: 20px;
                min-width: unset;
                width: 100%;
                max-width: 100%;
            }
        }

        .row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .current-time {
            font-size: 1.2em;
            font-weight: bold;
            color: #d9534f; /* 醒目紅色 */
            margin-left: 20px;
        }

        /* 修正：統一 margin-right 樣式，用於所有預估輸出 (不靠右對齊) */
        .margin-right {
            margin-left: auto;
            width: 240px; /* 固定寬度 240px */
            display: flex;
            align-items: center;
        }
        
        /* 針對目標噸數行，將右側元素往右推到底 */
        .target-row .margin-right {
            margin-left: auto;
        }

        /* 針對預估剩餘時間行，將整個 row 的內容往右推 */
        .remaining-time-row {
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .label {
            width: 100px;
            font-weight: bold;
            font-size: 1.1em;
            flex-shrink: 0;
        }

        input[type="number"] {
            padding: 8px;
            margin-right: 10px;
            border: 1px solid #aaa;
            border-radius: 4px;
            width: 80px;
            text-align: center;
            font-size: 16px;
        }
        
        /* Specific input width for sync value */
        #syncValue {
            width: 50px !important; 
        }

        button {
            padding: 8px 15px;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }

        button.small-btn {
            padding: 5px 10px;
            margin-left: 5px;
            width: 30px;
            height: 30px;
            font-size: 18px;
        }
        
        button.action-btn {
            background-color: #007bff;
        }
        
        button.action-btn:hover {
            background-color: #0056b3;
        }
        
        /* 重置按鈕樣式 */
        #resetBtn {
            background-color: #f0ad4e; /* 橘色 */
        }
        #resetBtn:hover {
            background-color: #ec971f;
        }


        /* Specific styling for the row with ST inputs */
        .st-group {
            display: flex;
            align-items: center;
        }

        .st-group .st-input {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 5px;
        }

        .st-group .st-input label {
            font-size: 1.2em;
            margin-bottom: 3px;
        }

        .st-group .st-input input {
            width: 50px;
            margin: auto;
        }

        /* Styling for the Sync button group */
        .st-group .sync-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 5px;
        }
        #syncBtn {
            padding: 5px 5px;
            margin: 0;
            width: 50px;
            margin-bottom: 3px; 
        }
        .st-group .sync-group label {
            margin-bottom: 3px; 
        }

        /* T/D and Target rows label alignment */
        .row .estimated-output {
            margin-left: 20px;
            font-weight: bold;
        }
        
        /* Chart container */
        .chart-container {
            width: 100%;
            height: 350px;
        }

        /* Hide the custom variable section visually, but keep the elements in DOM */
        .custom-vars {
            display: none; 
        }
    </style>
</head>
<body>
    <audio id="alarm-audio" loop preload="auto">
        <source src="web/alarm.mp3" type="audio/mpeg"> 
        Your browser does not support the audio element.
    </audio>

    <div class="combined-main-container">
        <div id="preheat-accordion" class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion('preheat-accordion')">
                <span>台車預熱計時系統</span>
                <span class="toggle-icon">▲</span>
            </div>
            <div class="accordion-content" style="display: none;">
                <div class="main-container">
                    <div id="car-1" class="car-container">
                        <div class="car-title">
                            <span>CAR#1</span>
                            <button class="reset-btn" onclick="resetCar('1')">重置</button>
                        </div>
                        
                        <div class="input-group car-number-group">
                            <label for="car-number-1">車號:</label>
                            <input type="number" id="car-number-1" min="00" max="99" maxlength="2" value="" onchange="saveCarNumber('1')">
                            <button onclick="setCurrentTime('1')" class="start-preheat-btn">開始預熱</button>
                        </div>

                        <div class="input-group start-time-group">
                            <label>開始時間:</label>
                            <span id="start-time-display-1" class="start-time-display">--:--</span>
                            <input type="datetime-local" id="start-time-1" onchange="updateStartTime('1')">
                        </div>
                        
                        <div class="input-group">
                            <label>升中火:</label>
                            <span id="countdown-display-medium-1" class="countdown-display time-safe">--:--</span>
                            <input type="number" id="set-duration-medium-1" step="0.1" min="0" value="1.0" onchange="saveAndUpdateTimer('1')"> 
                            <span class="unit-text">(小時)</span>
                            <button class="add-btn" id="add-btn-medium-1" onclick="adjustDuration('medium', 5, '1')">+5分</button>
                        </div>

                        <div class="input-group">
                            <label>升大火:</label>
                            <span id="countdown-display-high-1" class="countdown-display time-safe">--:--</span>
                            <input type="number" id="set-duration-high-1" step="0.1" min="0" value="1.0" onchange="saveAndUpdateTimer('1')"> 
                            <span class="unit-text">(小時)</span>
                            <button class="add-btn" id="add-btn-high-1" onclick="adjustDuration('high', 5, '1')">+5分</button>
                        </div>

                        <div class="input-group">
                            <label>轉保溫:</label>
                            <span id="countdown-display-keepwarm-1" class="countdown-display time-safe">--:--</span>
                            <input type="number" id="set-duration-keepwarm-1" step="0.1" min="0" value="1.0" onchange="saveAndUpdateTimer('1')"> 
                            <span class="unit-text">(小時)</span>
                            <button class="add-btn" id="add-btn-keepwarm-1" onclick="adjustDuration('keepwarm', 5, '1')">+5分</button>
                        </div>

                        <div class="input-group">
                            <label>預熱總時長:</label>
                            <span id="total-time-1" class="total-time-display total-time-alert-red">--:--</span>
                        </div>
                    </div>
                    
                    <div id="car-2" class="car-container">
                        <div class="car-title">
                            <span>CAR#2</span>
                            <button class="reset-btn" onclick="resetCar('2')">重置</button>
                        </div>

                        <div class="input-group car-number-group">
                            <label for="car-number-2">車號:</label>
                            <input type="number" id="car-number-2" min="00" max="99" maxlength="2" value="" onchange="saveCarNumber('2')">
                            <button onclick="setCurrentTime('2')" class="start-preheat-btn">開始預熱</button>
                        </div>

                        <div class="input-group start-time-group">
                            <label>開始時間:</label>
                            <span id="start-time-display-2" class="start-time-display">--:--</span>
                            <input type="datetime-local" id="start-time-2" onchange="updateStartTime('2')">
                        </div>
                        
                        <div class="input-group">
                            <label>升中火:</label>
                            <span id="countdown-display-medium-2" class="countdown-display time-safe">--:--</span>
                            <input type="number" id="set-duration-medium-2" step="0.1" min="0" value="1.0" onchange="saveAndUpdateTimer('2')"> 
                            <span class="unit-text">(小時)</span>
                            <button class="add-btn" id="add-btn-medium-2" onclick="adjustDuration('medium', 5, '2')">+5分</button>
                        </div>

                        <div class="input-group">
                            <label>升大火:</label>
                            <span id="countdown-display-high-2" class="countdown-display time-safe">--:--</span>
                            <input type="number" id="set-duration-high-2" step="0.1" min="0" value="1.0" onchange="saveAndUpdateTimer('2')"> 
                            <span class="unit-text">(小時)</span>
                            <button class="add-btn" id="add-btn-high-2" onclick="adjustDuration('high', 5, '2')">+5分</button>
                        </div>

                        <div class="input-group">
                            <label>轉保溫:</label>
                            <span id="countdown-display-keepwarm-2" class="countdown-display time-safe">--:--</span>
                            <input type="number" id="set-duration-keepwarm-2" step="0.1" min="0" value="1.0" onchange="saveAndUpdateTimer('2')"> 
                            <span class="unit-text">(小時)</span>
                            <button class="add-btn" id="add-btn-keepwarm-2" onclick="adjustDuration('keepwarm', 5, '2')">+5分</button>
                        </div>

                        <div class="input-group">
                            <label>預熱總時長:</label>
                            <span id="total-time-2" class="total-time-display total-time-alert-red">--:--</span>
                        </div>
                    </div>
                </div>
            </div> 
        </div>
        <div id="weight-accordion" class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion('weight-accordion')">
                <span>噸數計算器</span>
                <span class="toggle-icon">▲</span>
            </div>
            <div class="accordion-content">
                <div class="calculator-container">
                    <div class="input-section">

                        <div class="row">
                            <span class="label">初始噸數</span>
                            <input type="number" id="initialTons" value="150.0" step="0.1" min="0" max="200">
                            <button id="startPourBtn" class="action-btn">啟鑄</button>
                            <button id="continuousPourBtn" class="action-btn">連鑄</button>
                            <span id="currentTimeDisplay" class="current-time">00:00:00</span>
                            <button id="resetBtn" class="action-btn">重置</button>
                        </div>

                        <div class="row">
                            <span class="label">澆鑄速度</span>
                            <div class="st-group">
                                <div class="st-input">
                                    <label>ST4</label><input type="number" id="st4Speed" value="1.20" step="0.01" min="0" max="1.5">
                                </div>
                                <div class="st-input">
                                    <label>ST3</label><input type="number" id="st3Speed" value="1.20" step="0.01" min="0" max="1.5">
                                </div>
                                <div class="st-input">
                                    <label>ST2</label><input type="number" id="st2Speed" value="1.20" step="0.01" min="0" max="1.5">
                                </div>
                                <div class="st-input">
                                    <label>ST1</label><input type="number" id="st1Speed" value="1.20" step="0.01" min="0" max="1.5">
                                </div>
                                
                                <div class="sync-group">
                                    <button id="syncBtn" class="action-btn">同步</button>
                                    <input type="number" id="syncValue" value="1.20" step="0.01">
                                </div>
                                <button id="updateBtn" class="action-btn" disabled>更新</button>
                            </div>
                        </div>

                        <div class="row">
                            <span class="label">T/D噸數</span>
                            <input type="number" id="tdTons" value="25.0" step="0.1" min="0" max="30"> 
                            <button id="subtractTdTonsBtn" class="small-btn action-btn">-</button>
                            <button id="addTdTonsBtn" class="small-btn action-btn">+</button>
                            <div class="margin-right"> 
                                <span class="estimated-output">預估當前噸數:</span>
                                <span id="currentTonsEstimate" class="estimated-output">000.0</span>
                                <span class="estimated-output">噸</span>
                            </div>
                        </div>

                        <div class="row target-row">
                            <span class="label">目標噸數</span>
                            <input type="number" id="targetTons" value="10.0" step="0.1">
                            <span>噸</span>
                            <div class="margin-right"> 
                                <span class="estimated-output">預估結束時間:</span>
                                <span id="finishTimeEstimate" class="estimated-output">--:--</span>
                                <span id="finishTimeUnitSpan" class="estimated-output">時</span>
                            </div>
                        </div>

                        <div class="row remaining-time-row">
                            <div style="flex-grow: 1;"></div> 
                            
                            <div class="margin-right" id="remainingTimeContainer"> 
                                <span class="estimated-output">預估剩餘時間:</span>
                                <span id="remainingTimeEstimate" class="estimated-output">--</span>
                                <span id="remainingTimeUnitSpan" class="estimated-output">分</span>
                            </div>
                        </div>
                        <div class="custom-vars">
                            <div class="row">
                                <span class="label">時間變數 (時)</span>
                                <input type="number" id="customTimeVar" value="0.0" step="0.1">
                            </div>
                            <div class="row">
                                <span class="label">計算噸數 (噸)</span>
                                <input type="number" id="customTonsVar" value="0.0" step="0.1">

    </div>

    <div id="alertModal" class="modal">
        <div class="modal-content">
            <div id="modal-title" class="modal-title"></div>
            <div id="modal-countdown" class="modal-countdown"></div>
            <button class="modal-close-btn" onclick="closeAlertModal()">關閉 / 已處理</button>
        </div>
    </div>

    <footer class="bottom">
        <p>copyright &copy; 2025 longping.
        <a href="https://github.com/longping1950/CSC-shift">
            <img src="web/github-mark.png" alt="點擊前往專案" class="github-logo">
        </a>
        <span class="volume-control">
            <label for="volume-slider">警報音量</label>
            <input type="range" id="volume-slider" min="0" max="100">
        </span>
        </p>
    </footer>

    <script>
        // --- 核心變數結構化 ---
        const MS_PER_SECOND = 1000;
        const MS_PER_MINUTE = 60 * MS_PER_SECOND;
        const MS_PER_HOUR = 3600 * MS_PER_SECOND;
        const MINUTES_TO_HOURS = 1 / 60; 
        const THREE_HOURS_IN_MS = 3 * MS_PER_HOUR; 
        const FIVE_MINUTES_IN_MS = 5 * MS_PER_MINUTE; // 5分鐘警示線
        
        const STALE_ALERT_THRESHOLD_MS = -5 * MS_PER_MINUTE; 
        
        // --- 音量變數 ---
        const DEFAULT_VOLUME = 0.8; 
        const MIN_VOLUME_ALERT_THRESHOLD = 0.05; // 5%
        let currentVolume = DEFAULT_VOLUME; 
        let volumeAlertSent = false; 
        // ------------------
        
        let activeAlert = null; 
        let modalTimerInterval = null; 

        const carStates = {
            '1': {
                timerInterval: null,
                alertSentMedium: false,
                alertSentHigh: false,
                alertSentKeepWarm: false,
            },
            '2': {
                timerInterval: null,
                alertSentMedium: false,
                alertSentHigh: false,
                alertSentKeepWarm: false,
            }
        };
        
        const modal = document.getElementById('alertModal');
        const modalTitle = document.getElementById('modal-title');
        const modalCountdown = document.getElementById('modal-countdown');
        const alarmAudio = document.getElementById('alarm-audio');
        const volumeSlider = document.getElementById('volume-slider');


        function updateAccordionStateCookie() {
            const openIds = [];
            if (document.getElementById('preheat-accordion').classList.contains('active')) {
                openIds.push('preheat-accordion');
            }
            if (document.getElementById('weight-accordion').classList.contains('active')) {
                openIds.push('weight-accordion');
            }
            // 使用逗號分隔儲存 ID 列表
            setCookie('activeAccordions', openIds.join(','), 365);
        }

        // 修正後的 toggleAccordion (移除單一開啟限制)
        function toggleAccordion(id) {
            const item = document.getElementById(id);
            const content = item.querySelector('.accordion-content');
            
            item.classList.toggle('active');

            if (content.style.display === "block") {
                content.style.display = "none";
            } else {
                content.style.display = "block";
            }
            
            // 每次開合都更新 Cookie 狀態
            updateAccordionStateCookie();
        }

        // --- Cookie 處理函數 (不變) ---
        function setCookie(name, value, days = 365) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * MS_PER_HOUR));
            const expires = "; expires=" + date.toUTCString();
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        function eraseCookie(name) {
            document.cookie = name + '=; Max-Age=-99999999; path=/';
        }

        /** 根據台車編號獲取 ID 字串 */
        function getId(idBase, carId) {
            return idBase + '-' + carId;
        }

        // --- 音量控制與儲存函式 ---
        function saveVolume(volume) {
            setCookie('alertVolume', volume, 365); 
        }
        
        /** **修正**: 移除瀏覽器通知，改為控制台警報 */
        function sendLowVolumeAlert() {
            if (volumeAlertSent) return; 
            
            confirm(`🚨 警報：音量過低 🚨 - 警報音量設定為 ${Math.round(currentVolume * 100)}%，可能聽不到提醒！請檢查。`);
            volumeAlertSent = true; 
        }

        function setVolume(sliderValue) {
            const newVolume = parseFloat(sliderValue) / 100; 
            currentVolume = newVolume;
            alarmAudio.volume = currentVolume; 

            if (currentVolume < MIN_VOLUME_ALERT_THRESHOLD) {
                sendLowVolumeAlert(); // 使用修正後的警報
            } else {
                volumeAlertSent = false; 
            }

            saveVolume(newVolume);
        }

        function loadVolume() {
            const savedVolume = getCookie('alertVolume');
            const slider = document.getElementById('volume-slider');

            if (savedVolume !== null) {
                currentVolume = parseFloat(savedVolume);
            } else {
                currentVolume = DEFAULT_VOLUME; 
            }
            
            slider.value = Math.round(currentVolume * 100); 
            alarmAudio.volume = currentVolume; 
            
            if (currentVolume < MIN_VOLUME_ALERT_THRESHOLD) {
                sendLowVolumeAlert(); // 初始載入時檢查
            }
            
            slider.addEventListener('input', (event) => {
                setVolume(event.target.value);
            });
        }
        // ------------------------------------


        /** 播放警報音效 */
        function playAlertSound() {
            try {
                alarmAudio.volume = currentVolume; 
                alarmAudio.currentTime = 0;
                alarmAudio.play().catch(e => console.error("無法自動播放音效，需要使用者互動:", e));
            } catch (e) {
                console.error("音訊播放錯誤:", e);
            }
        }
        
        /** 停止警報音效 */
        function stopAlertSound() {
            alarmAudio.pause();
            alarmAudio.currentTime = 0;
        }
        
        /** 更新模態視窗中的超時時間顯示 */
        function updateModalCountdown(remainingMs) {
            if (remainingMs <= 0) {
                const overdueMinutes = Math.ceil(Math.abs(remainingMs) / MS_PER_MINUTE);
                modalCountdown.textContent = `已超時 ${overdueMinutes} 分`;
            } else {
                const totalMinutes = Math.floor(remainingMs / MS_PER_MINUTE);
                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;
                
                const countdownDisplay = 
                    String(hours).padStart(2, '0') + ':' + 
                    String(minutes).padStart(2, '0');
                
                modalCountdown.textContent = `剩餘: ${countdownDisplay}`; 
            }
        }

        /** 顯示警報模態視窗 */
        function showAlertModal(carId, stage, endTimeMs) {
            const carNumber = document.getElementById(getId('car-number', carId)).value || 'N/A';
            let stageTitle = '';
            
            if (stage === 'medium') { stageTitle = '升中火'; }
            else if (stage === 'high') { stageTitle = '升大火'; }
            else if (stage === 'keepwarm') { stageTitle = '轉保溫'; }
            
            modalTitle.textContent = `CAR#${carId} (${carNumber}) - ${stageTitle} ！`;
            
            const initialRemainingMs = endTimeMs - new Date().getTime();
            updateModalCountdown(initialRemainingMs); 
            
            modal.style.display = 'block';
            playAlertSound();
            
            activeAlert = { carId, stage, endTimeMs };
            
            if (modalTimerInterval) {
                clearInterval(modalTimerInterval);
            }
            
            modalTimerInterval = setInterval(() => {
                const now = new Date().getTime();
                const newRemainingMs = activeAlert.endTimeMs - now;
                updateModalCountdown(newRemainingMs);
            }, 1000);
        }

        /** 關閉警報模態視窗 */
        function closeAlertModal() {
            if (modalTimerInterval) {
                clearInterval(modalTimerInterval);
                modalTimerInterval = null;
            }
            
            if (activeAlert) {
                const state = carStates[activeAlert.carId];
                const stage = activeAlert.stage;
                const capitalizedStage = stage.charAt(0).toUpperCase() + stage.slice(1);
                state[`alertSent${capitalizedStage}`] = true;
                
                activeAlert = null;
            }
            stopAlertSound();
            modal.style.display = 'none';
        }


        /** 3. 儲存設定並自動啟動/更新計時器 */
        function saveAndUpdateTimer(carId) {
            const startTime = document.getElementById(getId('start-time', carId)).value; 
            const durationMedium = document.getElementById(getId('set-duration-medium', carId)).value;
            const durationHigh = document.getElementById(getId('set-duration-high', carId)).value;
            const durationKeepWarm = document.getElementById(getId('set-duration-keepwarm', carId)).value;

            setCookie(`car_${carId}_startTime`, startTime);
            setCookie(`car_${carId}_durationMedium`, durationMedium);
            setCookie(`car_${carId}_durationHigh`, durationHigh);
            setCookie(`car_${carId}_durationKeepWarm`, durationKeepWarm);

            autoStartTimer(carId);
        }

        /** 4. 啟動/更新單一台車的所有計時器 */
        function autoStartTimer(carId) {
            const state = carStates[carId];
            
            clearInterval(state.timerInterval); 
            
            state.alertSentMedium = false;
            state.alertSentHigh = false;
            state.alertSentKeepWarm = false;
            
            const startTimeInput = document.getElementById(getId('start-time', carId)).value;

            if (!startTimeInput) {
                // 清空顯示和移除閃爍
                updateTotalTimeDisplay(0, carId); // 傳入 0 確保清空和移除閃爍
                document.getElementById(getId('countdown-display-medium', carId)).textContent = '--:--';
                document.getElementById(getId('countdown-display-high', carId)).textContent = '--:--';
                document.getElementById(getId('countdown-display-keepwarm', carId)).textContent = '--:--';
                
                // 清除倒數計時的 flashing 類
                document.getElementById(getId('countdown-display-medium', carId)).classList.remove('flashing', 'time-safe', 'time-warning');
                document.getElementById(getId('countdown-display-high', carId)).classList.remove('flashing', 'time-safe', 'time-warning');
                document.getElementById(getId('countdown-display-keepwarm', carId)).classList.remove('flashing', 'time-safe', 'time-warning');
                return;
            }
            
            updateAllTimers(carId);
            state.timerInterval = setInterval(() => updateAllTimers(carId), 1000); 
        }

        /** 5. 主更新函數：計算總時長和三個倒數計時 */
        function updateAllTimers(carId) {
            const startTimeInput = document.getElementById(getId('start-time', carId)).value; 
            const now = new Date(); 
            
            if (!startTimeInput) return; 

            let startTime = new Date(startTimeInput);
            
            const elapsedMs = now.getTime() - startTime.getTime();
            
            // 處理總時長顯示和閃爍
            updateTotalTimeDisplay(Math.max(0, elapsedMs), carId);
            
            const durationMediumHours = parseFloat(document.getElementById(getId('set-duration-medium', carId)).value);
            const durationHighHours = parseFloat(document.getElementById(getId('set-duration-high', carId)).value);
            const durationKeepWarmHours = parseFloat(document.getElementById(getId('set-duration-keepwarm', carId)).value);

            const endTimeMedium = startTime.getTime() + (durationMediumHours * MS_PER_HOUR);
            const endTimeHigh = endTimeMedium + (durationHighHours * MS_PER_HOUR);
            const endTimeKeepWarm = endTimeHigh + (durationKeepWarmHours * MS_PER_HOUR);

            checkCountdownAndAlert('medium', endTimeMedium, now.getTime(), carId, carStates[carId]);
            checkCountdownAndAlert('high', endTimeHigh, now.getTime(), carId, carStates[carId]);
            checkCountdownAndAlert('keepwarm', endTimeKeepWarm, now.getTime(), carId, carStates[carId]);
        }

        /**
         * 檢查倒數狀態並處理提醒
         */
        function checkCountdownAndAlert(stage, endTimeMs, currentTimeMs, carId, state) {
            let remainingMs = endTimeMs - currentTimeMs;
            const displayId = getId(`countdown-display-${stage}`, carId);
            const element = document.getElementById(displayId);
            
            const durationInput = document.getElementById(getId(`set-duration-${stage}`, carId));
            const addButton = document.getElementById(getId(`add-btn-${stage}`, carId)); 
            
            const capitalizedStage = stage.charAt(0).toUpperCase() + stage.slice(1);
            let alertFlag = state[`alertSent${capitalizedStage}`];
            
            const totalMinutes = Math.floor(remainingMs / MS_PER_MINUTE);

            if (totalMinutes <= 0) { 
                // 1. 歸零時鎖定輸入和按鈕
                durationInput.disabled = true;
                addButton.disabled = true;
                
                // 2. 顯示固定紅色 '00:00'
                element.textContent = '00:00';
                element.classList.remove('flashing', 'time-safe'); 
                element.classList.add('time-warning'); // 固定紅色顯示
                
                // 3. 警報彈窗: 
                if (!alertFlag && remainingMs > STALE_ALERT_THRESHOLD_MS) {
                   if (!activeAlert) { 
                       showAlertModal(carId, stage, endTimeMs); 
                   }
                }

            } else {
                // 倒數中 (totalMinutes > 0)
                
                // 1. 確保輸入和按鈕已啟用
                durationInput.disabled = false;
                addButton.disabled = false;

                // 2. 移除歸零閃爍
                element.classList.remove('flashing');
                
                // 3. 5 分鐘顏色警示
                if (remainingMs <= FIVE_MINUTES_IN_MS) {
                    element.classList.remove('time-safe');
                    element.classList.add('time-warning'); // 紅色
                } else {
                    element.classList.remove('time-warning');
                    element.classList.add('time-safe'); // 黑色
                }
                
                // 4. 顯示倒數時間
                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;

                const countdownDisplay = 
                    String(hours).padStart(2, '0') + ':' + 
                    String(minutes).padStart(2, '0');
                
                element.textContent = countdownDisplay;
            }
        }
        
        // --- 其他輔助函數 (保持不變) ---
        function setCurrentTime(carId) {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const datetimeString = `${year}-${month}-${day}T${hours}:${minutes}`;

            document.getElementById(getId('start-time', carId)).value = datetimeString;
            document.getElementById(getId('start-time-display', carId)).textContent = `${hours}:${minutes}`;
            
            saveAndUpdateTimer(carId);
        }

        function updateStartTime(carId) {
            const timeInput = document.getElementById(getId('start-time', carId));
            const datetimeValue = timeInput.value;
            
            if (datetimeValue) {
                const timePart = datetimeValue.split('T')[1]; 
                document.getElementById(getId('start-time-display', carId)).textContent = timePart || '--:--';
            } else {
                document.getElementById(getId('start-time-display', carId)).textContent = '--:--';
            }
            
            saveAndUpdateTimer(carId);
        }
        
        function saveCarNumber(carId) {
            const carNumber = document.getElementById(getId('car-number', carId)).value;
            setCookie(`car_${carId}_carNumber`, carNumber);
        }


        function adjustDuration(stage, minutes, carId) {
            const inputId = getId(`set-duration-${stage}`, carId);
            const inputElement = document.getElementById(inputId);
            
            let currentHours = parseFloat(inputElement.value) || 0;
            const hoursToAdd = minutes * MINUTES_TO_HOURS; 
            
            let newHours = currentHours + hoursToAdd;
            
            inputElement.value = newHours.toFixed(1); 
            
            saveAndUpdateTimer(carId);
        }
        
        /** **核心修正**: 更新總時長顯示，實現冒號閃爍 */
        function updateTotalTimeDisplay(elapsedMs, carId) {
            const totalElement = document.getElementById(getId('total-time', carId));
            
            if (elapsedMs === 0) {
                totalElement.innerHTML = '--:--';
                totalElement.classList.remove('total-time-alert-green', 'total-time-alert-red');
                return;
            }
            
            const totalMinutes = Math.floor(elapsedMs / MS_PER_MINUTE);
            const hours = String(Math.floor(totalMinutes / 60)).padStart(2, '0');
            const minutes = String(totalMinutes % 60).padStart(2, '0');
            
            // 決定顏色類
            if (elapsedMs < THREE_HOURS_IN_MS) {
                totalElement.classList.remove('total-time-alert-green');
                totalElement.classList.add('total-time-alert-red');
            } else {
                totalElement.classList.remove('total-time-alert-red');
                totalElement.classList.add('total-time-alert-green');
            }

            // **新結構**: 使用 span 讓冒號獨立出來，並控制其閃爍
            const colonClass = (elapsedMs > 0) ? 'colon flashing-colon' : 'colon';
            
            const totalDisplayHTML = 
                `${hours}<span class="${colonClass}">:</span>${minutes}`;
            
            totalElement.innerHTML = totalDisplayHTML;
        }

        function resetCar(carId) {
            if (!confirm(`確定要重置 CAR#${carId} 嗎？`)) {
                return;
            }
            
            const state = carStates[carId];
            
            clearInterval(state.timerInterval);
            state.timerInterval = null;

            state.alertSentMedium = false;
            state.alertSentHigh = false;
            state.alertSentKeepWarm = false;

            // 清除 DOM 元素值
            document.getElementById(getId('car-number', carId)).value = '';
            document.getElementById(getId('start-time', carId)).value = '';
            document.getElementById(getId('start-time-display', carId)).textContent = '--:--';
            document.getElementById(getId('set-duration-medium', carId)).value = '1.0'; 
            document.getElementById(getId('set-duration-high', carId)).value = '1.0';
            document.getElementById(getId('set-duration-keepwarm', carId)).value = '1.0';
            
            // 清空顯示和移除閃爍
            const totalElement = document.getElementById(getId('total-time', carId));
            totalElement.textContent = '--:--'; // 重置為純文字
            totalElement.classList.remove('total-time-alert-red', 'total-time-alert-green');
            
            const stages = ['medium', 'high', 'keepwarm'];
            stages.forEach(stage => {
                const displayElement = document.getElementById(getId(`countdown-display-${stage}`, carId));
                displayElement.textContent = '--:--';
                displayElement.classList.remove('flashing', 'time-warning'); 
                displayElement.classList.add('time-safe'); 

                const durationInput = document.getElementById(getId(`set-duration-${stage}`, carId));
                const addButton = document.getElementById(getId(`add-duration-${stage}`, carId));
                if(durationInput) durationInput.disabled = false;
                if(addButton) addButton.disabled = false;
            });
            
            // 清除所有相關 Cookie
            eraseCookie(`car_${carId}_startTime`);
            eraseCookie(`car_${carId}_durationMedium`);
            eraseCookie(`car_${carId}_durationHigh`);
            eraseCookie(`car_${carId}_durationKeepWarm`);
            eraseCookie(`car_${carId}_carNumber`);

            if (activeAlert && activeAlert.carId === carId) {
                closeAlertModal(); 
            }
        }

        function loadCarState(carId) {
            const startTime = getCookie(`car_${carId}_startTime`);
            const durationMedium = getCookie(`car_${carId}_durationMedium`);
            const durationHigh = getCookie(`car_${carId}_durationHigh`);
            const durationKeepWarm = getCookie(`car_${carId}_durationKeepWarm`);
            const carNumber = getCookie(`car_${carId}_carNumber`);
            
            if (durationMedium) document.getElementById(getId('set-duration-medium', carId)).value = parseFloat(durationMedium).toFixed(1);
            if (durationHigh) document.getElementById(getId('set-duration-high', carId)).value = parseFloat(durationHigh).toFixed(1);
            if (durationKeepWarm) document.getElementById(getId('set-duration-keepwarm', carId)).value = parseFloat(durationKeepWarm).toFixed(1);
            
            if (carNumber) document.getElementById(getId('car-number', carId)).value = carNumber;

            if (startTime) {
                document.getElementById(getId('start-time', carId)).value = startTime;
                
                const timePart = startTime.split('T')[1]; 
                document.getElementById(getId('start-time-display', carId)).textContent = timePart || '--:--';
                
                autoStartTimer(carId);
            }
        }


        document.addEventListener('DOMContentLoaded', () => {
            loadVolume(); 
            ['1', '2'].forEach(loadCarState);
            
            window.onclick = function(event) {
                if (event.target === modal) {
                    // Do nothing, force user to click the close button
                }
            }
            
            const activeIdsString = getCookie('activeAccordions');
            const allAccordionIds = ['preheat-accordion', 'weight-accordion']; 
            
            allAccordionIds.forEach(id => {
                const item = document.getElementById(id);
                const content = item.querySelector('.accordion-content');
                
                // 如果 Cookie 中有該 ID，則開啟它
                if (activeIdsString && activeIdsString.includes(id)) {
                    item.classList.add('active');
                    content.style.display = 'block';
                } else {
                    // 確保其他未儲存狀態或未選擇的保持關閉
                    item.classList.remove('active');
                    content.style.display = 'none';
                }
            });
        });
    </script>
    <script>
        // --- 常數定義 (Constants) ---
        const TIME_CONVERSION_FACTOR = 0.438; // 0.438 單位為 噸/分鐘
        const START_TIME_OFFSET_MS = 5 * 60 * 1000; // 5分鐘
        const START_TONS_OFFSET = 2.75; // 2.0 噸
        const CHART_DURATION_MS = 2 * 60 * 60 * 1000; // 圖表固定顯示 2 小時

        // --- 全局狀態變數 (Global State Variables) ---
        let activeStSpeedSum = 0; 
        let tonsTimeChart; 
        let isPouringActive = false; // 預估程序開關
        let chartHistoryData = []; // 用於保存圖表的歷史軌跡

        // --- 元素選擇 (Element Selectors) ---
        const $ = id => document.getElementById(id);

        // 輸入元素
        const stInputs = [$('st1Speed'), $('st2Speed'), $('st3Speed'), $('st4Speed')];
        
        // 輸出元素 
        const currentTonsEstimateSpan = $('currentTonsEstimate');
        const finishTimeEstimateSpan = $('finishTimeEstimate');
        const finishTimeUnitSpan = $('finishTimeUnitSpan'); 
        const remainingTimeEstimateSpan = $('remainingTimeEstimate'); 
        const remainingTimeUnitSpan = $('remainingTimeUnitSpan'); 
        
        const currentTimeDisplaySpan = $('currentTimeDisplay');
        
        // 按鈕元素
        const resetBtn = $('resetBtn'); 
        const updateBtn = $('updateBtn'); 


        // 獲取所有 ST 速度的總和 (用於凍結)
        function getTotalStSpeed() {
            return stInputs.reduce((sum, input) => sum + parseFloat(input.value) || 0, 0);
        }
        
        // 將毫秒時間戳轉換為以小時為單位的小數
        function timeToHours(timestamp) {
            return timestamp / (1000 * 60 * 60);
        }
        
        // 將小時為單位的小數轉換為毫秒時間戳 (epoch time)
        function hoursToMs(hours) {
            return hours * 1000 * 60 * 60;
        }

        // 將毫秒時間戳格式化為 hh:mm (實際結束時間)
        function formatTimeHHMM(ms) {
            if (ms === Infinity) return '∞';
            if (ms < 0) return '--:--'; 
            
            const date = new Date(ms);
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0'); 
            
            return `${hours}:${minutes}`;
        }

        // 實時更新目前時間
        function updateCurrentTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            currentTimeDisplaySpan.textContent = `${hours}:${minutes}:${seconds}`;
        }

        // --- 核心計算邏輯 ---

        // 僅更新實時變動的值：當前噸數
        function updateRealTimeEstimates() {
            if (!isPouringActive) return;

            const now = Date.now();
            const customTime_hours = parseFloat($('customTimeVar').value) || 0;
            const customTime_ms = hoursToMs(customTime_hours);
            const customTons = parseFloat($('customTonsVar').value) || 0;
            const tdTons = parseFloat($('tdTons').value) || 0;
            
            // 1. 預估當前噸數 (currentTonsEstimate)
            const timeDiff_ms = now - customTime_ms; 
            const timeDiff_minutes = timeDiff_ms / (1000 * 60); // 轉換為分鐘

            let currentTons = customTons - tdTons - (timeDiff_minutes * activeStSpeedSum * TIME_CONVERSION_FACTOR);
            currentTons = Math.max(0, currentTons);
            
            // 修正：檢查元素是否存在，避免 TypeError
            if (currentTonsEstimateSpan) currentTonsEstimateSpan.textContent = currentTons.toFixed(1);
        }

        // 更新依賴於輸入或操作的值：預估結束時間、剩餘時間和圖表
        function updateDependentEstimates(resetChart = true) {
            if (!isPouringActive) return;

            updateRealTimeEstimates(); 

            const now = Date.now();
            // 修正：由於 updateRealTimeEstimates() 已更新，直接從 span 獲取
            const currentTons = parseFloat(currentTonsEstimateSpan.textContent) || 0; 
            const targetTons = parseFloat($('targetTons').value) || 0;
            const totalSpeed = activeStSpeedSum; 
            
            // --- 預估結束時間 & 剩餘時間 ---
            const tonsRemaining = currentTons - targetTons;
            let finishTimeMs = 0;
            let timeToTarget_minutes = 0;

            // 修正：檢查元素是否存在，避免 TypeError
            if (totalSpeed > 0 && tonsRemaining > 0) {
                timeToTarget_minutes = tonsRemaining / (totalSpeed * TIME_CONVERSION_FACTOR); 
                const timeToTarget_ms = timeToTarget_minutes * 1000 * 60; 
                
                finishTimeMs = now + timeToTarget_ms;
                
                if (finishTimeEstimateSpan) finishTimeEstimateSpan.textContent = formatTimeHHMM(finishTimeMs);
                if (finishTimeUnitSpan) finishTimeUnitSpan.textContent = '時';
                if (remainingTimeEstimateSpan) remainingTimeEstimateSpan.textContent = Math.ceil(timeToTarget_minutes); // 向上取整顯示分鐘
                if (remainingTimeUnitSpan) remainingTimeUnitSpan.textContent = '分';
            } else if (totalSpeed === 0) {
                if (finishTimeEstimateSpan) finishTimeEstimateSpan.textContent = '∞';
                if (finishTimeUnitSpan) finishTimeUnitSpan.textContent = '';
                if (remainingTimeEstimateSpan) remainingTimeEstimateSpan.textContent = '∞';
                if (remainingTimeUnitSpan) remainingTimeUnitSpan.textContent = '';
            } else {
                if (finishTimeEstimateSpan) finishTimeEstimateSpan.textContent = formatTimeHHMM(now);
                if (finishTimeUnitSpan) finishTimeUnitSpan.textContent = '時';
                if (remainingTimeEstimateSpan) remainingTimeEstimateSpan.textContent = '0'; // 已達成目標
                if (remainingTimeUnitSpan) remainingTimeUnitSpan.textContent = '分';
            }
            
            // --- 圖表更新所需參數 ---
            const customTime_hours = parseFloat($('customTimeVar').value) || 0;
            const customTime_ms = hoursToMs(customTime_hours);

            updateChart(customTime_ms, 0, currentTons, finishTimeMs, targetTons, resetChart);
        }

        // --- 圖表邏輯 (Chart Logic) ---

        function initializeChart() {
            const ctx = $('tonsTimeChart').getContext('2d');
            Chart.defaults.color = '#333';
            tonsTimeChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: '歷史軌跡',
                        data: [],
                        borderColor: 'rgb(75, 192, 192)', // 歷史線：實線 (藍綠色)
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        tension: 0, 
                        fill: false,
                        pointRadius: 3,
                        borderDash: []
                    },
                    {
                        label: '預估趨勢',
                        data: [],
                        borderColor: 'rgb(150, 150, 150)', // 預估線：虛線 (灰色)
                        tension: 0, 
                        fill: false,
                        pointRadius: 0, 
                        borderDash: [5, 5] // 虛線設定
                    },
                    {
                        label: '目標噸數',
                        data: [],
                        borderColor: 'rgb(255, 99, 132)',
                        borderDash: [5, 5],
                        pointRadius: 0
                    }]
                },
                options: {
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'minute',
                                tooltipFormat: 'HH:mm',
                                displayFormats: {
                                    minute: 'HH:mm',
                                    hour: 'HH:mm'
                                }
                            },
                            title: {
                                display: true,
                                text: '時間 (HH:MM)'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: '噸數 (Tons)'
                            },
                            beginAtZero: true
                        }
                    },
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }
        
        // 根據 resetChart 策略更新圖表
        function updateChart(startTimeMs, startTons, currentTons, finishTimeMs, targetTons, resetChart) {
            if (!tonsTimeChart) return;

            const nowMs = Date.now();
            const historyData = tonsTimeChart.data.datasets[0].data; // 歷史軌跡
            const predictionData = tonsTimeChart.data.datasets[1].data; // 預估趨勢
            const targetData = tonsTimeChart.data.datasets[2].data; // 目標噸數
            const totalSpeed = activeStSpeedSum;
            
            // --- 處理歷史軌跡 ---
            if (resetChart) {
                // 啟鑄/連鑄/重置：清除歷史數據，僅保留當前點作為新歷史的起點
                chartHistoryData = [];
                historyData.length = 0; 
                predictionData.length = 0; 

                if (isPouringActive) {
                    const startingPoint = { x: nowMs, y: currentTons };
                    chartHistoryData.push(startingPoint);
                    historyData.push(startingPoint); 
                }
            } else if (isPouringActive) {
                // 更新/T/D/目標噸數變動：將當前點加入歷史軌跡
                
                // 1. 將當前點加入歷史軌跡
                if (chartHistoryData.length === 0 || chartHistoryData[chartHistoryData.length - 1].x < nowMs - 1000) {
                    chartHistoryData.push({ x: nowMs, y: currentTons });
                }
                
                // 2. 歷史線從累積的歷史數據繪製
                historyData.length = 0;
                // 過濾掉時間早於起始時間點的歷史數據，防止圖表在連鑄/更新後回溯
                const activeHistory = chartHistoryData.filter(point => point.x >= startTimeMs);
                historyData.push(...activeHistory);

                // 3. 確保歷史線的最後一個點是當前時間 (用於連接預估線)
                const currentPoint = { x: nowMs, y: currentTons };
                if (activeHistory.length === 0 || activeHistory[activeHistory.length - 1].x !== nowMs) {
                    historyData.push(currentPoint);
                }
            } else {
                historyData.length = 0; // 如果非活動，清除所有線
                predictionData.length = 0;
            }
            
            // 確保歷史數據點按時間排序
            historyData.sort((a, b) => a.x - b.x);


            // --- 繪製預估線 ---
            predictionData.length = 0; // 總是清除舊的預估線
            if (isPouringActive && totalSpeed > 0 && currentTons > targetTons && finishTimeMs > nowMs) {
                
                // 預估線的起點是當前點 (連接歷史線的終點)
                predictionData.push({ x: nowMs, y: currentTons });
                
                // 結束點 (Finish Time, targetTons)
                predictionData.push({ x: finishTimeMs, y: targetTons });
            }
            
            // --- Chart Time Axis Control (Fixed 2 hours) ---
            let minTimeMs;
            
            if (isPouringActive && historyData.length > 0) {
                // Start from the absolute earliest point in the history data
                minTimeMs = historyData[0].x;
            } else {
                // If inactive or data is empty, start the axis 2 hours ago from now
                minTimeMs = nowMs - CHART_DURATION_MS; 
            }
            
            const maxTimeMs = minTimeMs + CHART_DURATION_MS; // 2 hours duration

            tonsTimeChart.options.scales.x.min = minTimeMs;
            tonsTimeChart.options.scales.x.max = maxTimeMs;

            // --- 目標線數據 (恆定 targetTons) ---
            targetData.length = 0;
            targetData.push({ x: minTimeMs, y: targetTons });
            targetData.push({ x: maxTimeMs, y: targetTons });

            // 重新繪製
            tonsTimeChart.update();
        }
        
        // --- 重置功能 ---
        function handleReset() {
            isPouringActive = false;
            updateBtn.disabled = true; // 停用更新按鈕
            activeStSpeedSum = getTotalStSpeed(); 
            chartHistoryData = [];

            // 重置 custom 變數到預設值
            const now = Date.now();
            const initialTonsVal = parseFloat($('initialTons').value) || 0;
            const tdTonsVal = parseFloat($('tdTons').value) || 0;
            
            $('customTimeVar').value = timeToHours(now).toFixed(3);
            $('customTonsVar').value = (initialTonsVal + tdTonsVal).toFixed(1);

            if (currentTonsEstimateSpan) currentTonsEstimateSpan.textContent = '000.0';
            if (finishTimeEstimateSpan) finishTimeEstimateSpan.textContent = '--:--';
            if (finishTimeUnitSpan) finishTimeUnitSpan.textContent = '時'; 
            if (remainingTimeEstimateSpan) remainingTimeEstimateSpan.textContent = '--'; 
            if (remainingTimeUnitSpan) remainingTimeUnitSpan.textContent = '分'; 
            
            // 重置圖表 (true 重置歷史)
            updateChart(0, 0, 0, 0, parseFloat($('targetTons').value) || 0, true); 
        }


        // --- 事件處理器與初始化 ---

        // T/D 噸數按鈕: +0.5 / -0.5
        const handleTdTonsChange = (delta) => {
            let current = parseFloat($('tdTons').value) || 0;
            let max = parseFloat($('tdTons').max) || Infinity;
            let min = parseFloat($('tdTons').min) || 0;
            let newValue = Math.min(max, Math.max(min, current + delta));
            $('tdTons').value = newValue.toFixed(1);
            updateDependentEstimates(false); 
        };

        $('addTdTonsBtn').addEventListener('click', () => handleTdTonsChange(0.5));
        $('subtractTdTonsBtn').addEventListener('click', () => handleTdTonsChange(-0.5));
        
        // 目標噸數變動
        $('targetTons').addEventListener('input', () => {
            if (!isPouringActive) return;
            updateDependentEstimates(false);
        });
        
        // 連接重置按鈕事件
        resetBtn.addEventListener('click', handleReset);


        // 同步按鈕 (syncBtn)
        $('syncBtn').addEventListener('click', () => {
            const syncValue = parseFloat($('syncValue').value);
            if (syncValue === 0) return; 
            
            stInputs.forEach(input => {
                if (parseFloat(input.value) !== 0) {
                    let newValue = Math.min(parseFloat(input.max) || Infinity, syncValue);
                    input.value = newValue.toFixed(2);
                }
            });
        });

        // 啟鑄/連鑄/更新按鈕 - 凍結速度並更新 custom 變數
        const setupPour = (isStartPour, isContinuousPour, isUpdate) => {
            isPouringActive = true; 
            updateBtn.disabled = false; // 啟用更新按鈕
            activeStSpeedSum = getTotalStSpeed(); 
            const now = Date.now();
            
            const newTimeMs = now;
            $('customTimeVar').value = timeToHours(newTimeMs).toFixed(3);

            let newTons = 0;
            if (isStartPour || isContinuousPour) {
                const initialTons = parseFloat($('initialTons').value) || 0;
                const tdTons = parseFloat($('tdTons').value) || 0;
                
                if (isStartPour) {
                    const activeStCount = stInputs.filter(input => parseFloat(input.value) !== 0).length;
                    newTons = initialTons - (activeStCount * START_TONS_OFFSET);
                } else { // isContinuousPour
                    newTons = initialTons + tdTons;
                }
            } else if (isUpdate) { // isUpdate
                updateRealTimeEstimates(); 
                // 修正：從更新後的 span 獲取當前噸數
                const currentTonsEstimate = parseFloat(currentTonsEstimateSpan.textContent) || 0; 
                const tdTons = parseFloat($('tdTons').value) || 0;
                newTons = currentTonsEstimate + tdTons;
            }
            
            $('customTonsVar').value = (newTons || 0).toFixed(1);
            
            // 啟鑄/連鑄 需要重置圖表歷史 (resetChart = true)
            updateDependentEstimates(isStartPour || isContinuousPour);
        };

        $('startPourBtn').addEventListener('click', () => setupPour(true, false, false));
        $('continuousPourBtn').addEventListener('click', () => setupPour(false, true, false));
        // 此處包含錯誤報告中的行號 (如 weight.html:683)，已修正邏輯
        $('updateBtn').addEventListener('click', () => setupPour(false, false, true)); 

        // --- 頁面初始化 (DOM Ready) ---

        document.addEventListener('DOMContentLoaded', () => {
            // 1. 初始化圖表
            initializeChart();
            
            // 2. 初始速度凍結
            activeStSpeedSum = getTotalStSpeed(); 

            // 3. 執行重置邏輯，將所有狀態初始化到非活動狀態的預設值
            handleReset(); 

            // 4. 定時器：僅更新實時數據 (currentTons) 和目前時間
            setInterval(() => {
                updateCurrentTime();
                updateRealTimeEstimates(); 
            }, 1000); 

        });

    </script>

</body>
