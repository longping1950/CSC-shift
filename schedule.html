<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加班查詢</title>
    <link rel="shortcut icon" href="web/favicon.ico" type="image/x-icon">
    <link rel="icon" href="web/favicon.ico" type="image/x-icon">
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- 設定 Tailwind 的 Dark Mode config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151f32', // 自訂更深的背景色
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* 自定義班別顏色 (支援 Dark Mode) */
        .shift-早 { 
            background-color: #9dd7db; color: #005f6b; border: 1px solid #7bc0c5; 
        }
        .dark .shift-早 {
            background-color: #005f6b; color: #9dd7db; border: 1px solid #004d57;
        }

        .shift-中 { 
            background-color: #ceb98d; color: #5c450a; border: 1px solid #bba373; 
        }
        .dark .shift-中 {
            background-color: #5c450a; color: #ceb98d; border: 1px solid #4a3808;
        }

        .shift-夜 { 
            background-color: #c6a1cf; color: #4a1f5c; border: 1px solid #af8ab8; 
        }
        .dark .shift-夜 {
            background-color: #4a1f5c; color: #c6a1cf; border: 1px solid #3b184a;
        }

        .shift-休 { 
            background-color: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; 
        }
        .dark .shift-休 {
            background-color: #1e293b; color: #64748b; border: 1px solid #334155;
        }
        
        body {
            font-family: system-ui, -apple-system, "Microsoft JhengHei", sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 min-h-screen p-4 md:p-6 text-slate-800 dark:text-slate-100 flex flex-col transition-colors duration-200">

    <div class="max-w-4xl mx-auto w-full space-y-6 flex-grow">
        
        <!-- 頂部卡片 -->
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 transition-colors duration-200">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
                <h1 class="text-2xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                    <i data-lucide="calendar-days" class="text-slate-600 dark:text-slate-300"></i>
                    加班查詢
                </h1>
                
                <div class="flex items-center gap-2">
                    <!-- 深色模式切換按鈕 -->
                    <button id="themeToggle" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors" title="切換深色模式">
                        <i data-lucide="moon" class="block dark:hidden"></i>
                        <i data-lucide="sun" class="hidden dark:block"></i>
                    </button>

                    <a href="./shift.html" 
                       class="flex items-center gap-2 px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg transition-colors text-sm font-medium">
                       <i data-lucide="calendar"></i>
                       班表查詢
                    </a>
                </div>
            </div>

            <!-- 控制列 -->
            <div class="flex flex-col md:flex-row gap-4 items-center justify-between bg-slate-50 dark:bg-slate-700/50 p-4 rounded-lg border border-slate-100 dark:border-slate-700/50">
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <label class="font-medium text-slate-600 dark:text-slate-300 whitespace-nowrap">日期:</label>
                    <input type="date" id="dateInput" class="w-full md:w-auto bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium shadow-sm text-slate-700 dark:text-slate-200">
                </div>

                <div class="flex items-center gap-3 w-full md:w-auto">
                    <label class="font-medium text-slate-600 dark:text-slate-300 whitespace-nowrap">股別:</label>
                    <div class="relative w-full md:w-40">
                        <select id="partSelect" class="w-full appearance-none bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md px-3 py-2 pr-8 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium shadow-sm cursor-pointer text-slate-700 dark:text-slate-200">
                            <optgroup label="4班3輪">
                                <option value="0">A股</option>
                                <option value="1">B股</option>
                                <option value="2">C股</option>
                                <option value="3">D股</option>
                            </optgroup>
                            <optgroup label="3班3輪">
                                <option value="E">E股</option>
                                <option value="F">F股</option>
                                <option value="G">G股</option>
                            </optgroup>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500 dark:text-slate-400">
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 班表內容卡片 -->
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden transition-colors duration-200">
            <div class="p-4 bg-slate-50 dark:bg-slate-700/50 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                <h2 id="tableTitle" class="font-bold text-lg text-slate-700 dark:text-slate-200">班表內容</h2>
                <div class="flex gap-2">
                    <button id="prevWeekBtn" class="flex items-center gap-1 px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-md text-sm font-medium transition-colors shadow-sm">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i> 上週
                    </button>
                    <button id="nextWeekBtn" class="flex items-center gap-1 px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-md text-sm font-medium transition-colors shadow-sm">
                        下週 <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 dark:bg-slate-900/50 text-slate-600 dark:text-slate-400 text-sm uppercase tracking-wider">
                            <!-- 調整欄位寬度與標題 -->
                            <th class="px-6 py-4 font-semibold border-b border-slate-200 dark:border-slate-700 w-1/3">日期</th>
                            <th class="px-6 py-4 font-semibold border-b border-slate-200 dark:border-slate-700 text-center w-1/3">班別</th>
                            <th class="px-6 py-4 font-semibold border-b border-slate-200 dark:border-slate-700 text-center w-1/3">請假代理</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody" class="divide-y divide-slate-100 dark:divide-slate-700">
                        <!-- 內容由 JS 動態生成 -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modal (彈出視窗：保留作為補充詳細資訊用，例如半天) -->
    <div id="detailModal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <!-- 背景遮罩 -->
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity opacity-0" id="modalBackdrop"></div>

        <div class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
                <!-- Modal Panel -->
                <div class="relative transform overflow-hidden rounded-lg bg-white dark:bg-slate-800 text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-sm opacity-0 scale-95" id="modalPanel">
                    
                    <div class="bg-slate-50 dark:bg-slate-700/50 px-4 py-3 border-b border-slate-200 dark:border-slate-600 flex justify-between items-center">
                        <h3 class="text-lg font-semibold leading-6 text-slate-900 dark:text-white" id="modalTitle">詳細資訊</h3>
                        <button type="button" id="closeModalBtn" class="text-slate-400 hover:text-slate-500 dark:hover:text-slate-300 focus:outline-none">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <div class="px-4 py-5 sm:p-6 space-y-4">
                        <!-- 班別 -->
                        <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                            <span class="text-sm font-medium text-slate-500 dark:text-slate-400">班別</span>
                            <span id="modalShift" class="text-base font-bold text-slate-900 dark:text-white">-</span>
                        </div>
                        
                        <!-- 請假代理 -->
                        <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                            <span class="text-sm font-medium text-slate-500 dark:text-slate-400">請假代理</span>
                            <span id="modalAgent" class="text-base font-medium text-slate-900 dark:text-white">-</span>
                        </div>
                        
                        <!-- 半天 -->
                        <div class="flex justify-between items-center pt-1">
                            <span class="text-sm font-medium text-slate-500 dark:text-slate-400">半天</span>
                            <span id="modalHalf" class="text-base font-medium text-slate-900 dark:text-white">-</span>
                        </div>
                    </div>

                    <div class="bg-slate-50 dark:bg-slate-700/30 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                        <button type="button" id="closeModalBtnBottom" class="inline-flex w-full justify-center rounded-md bg-white dark:bg-slate-700 px-3 py-2 text-sm font-semibold text-slate-900 dark:text-white shadow-sm ring-1 ring-inset ring-slate-300 dark:ring-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600 sm:mt-0 sm:w-auto">關閉</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="text-center text-slate-400 dark:text-slate-500 text-sm py-6 mt-auto">
        <p class="flex items-center justify-center gap-1">
            <span id="copyrightYear"></span>
            &copy; longping. Shift System.
            <!-- 增加 margin-left (ml-4) 讓連結隔開一點 -->
            <a href="https://github.com/longping1950/CSC-shift" class="ml-4 hover:text-blue-500 transition-colors" title="View on GitHub">
                <i data-lucide="github" class="w-4 h-4"></i>
            </a>
        </p>
    </footer>

    <script>
        // ===========================
        // 資料與邏輯核心
        // ===========================

        const List = ["中","中","中","中","中","休","早","早","早","早","早","休","休","夜","夜","夜","夜","夜","休","休"];
        const List1 = [
            ["C/D","C","B/C","D","D","","B","B","C","C","B/C","","","B","B","B","D","D","",""],
            ["D/A","D","C/D","A","A","","C","C","D","D","C/D","","","C","C","C","A","A","",""],
            ["A/B","A","D/A","B","B","","D","D","A","A","D/A","","","D","D","D","B","B","",""],
            ["B/C","B","A/B","C","C","","A","A","B","B","A/B","","","A","A","A","C","C","",""]
        ];
        const List2 = [
            ["","B/D","","B/C","B/C","","C/D","C/D","B/D","B/D","","","","","","","","","",""],
            ["","C/A","","C/D","C/D","","D/A","D/A","C/A","C/A","","","","","","","","","",""],
            ["","D/B","","D/A","D/A","","A/B","A/B","D/B","D/B","","","","","","","","","",""],
            ["","A/C","","A/B","A/B","","B/C","B/C","A/C","A/C","","","","","","","","","",""]
        ];

        function getOrdinalDate(date) {
            const utcDate = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
            return Math.floor(utcDate / 86400000);
        }

        function getEFGShift(date, group) {
            const baseDate = new Date(2026, 0, 26);
            baseDate.setHours(0,0,0,0);
            
            const targetDate = new Date(date);
            targetDate.setHours(0,0,0,0);
            
            const dayOfWeek = targetDate.getDay(); 
            const diffToMon = (dayOfWeek + 6) % 7;
            const targetMonday = new Date(targetDate);
            targetMonday.setDate(targetDate.getDate() - diffToMon);

            const msPerWeek = 7 * 24 * 60 * 60 * 1000;
            const diffWeeks = Math.floor((targetMonday.getTime() - baseDate.getTime()) / msPerWeek);

            let cycle = diffWeeks % 3;
            if (cycle < 0) cycle += 3;

            const patterns = {
                'E': ['中', '早', '夜'],
                'F': ['早', '夜', '中'],
                'G': ['夜', '中', '早']
            };
            
            const shiftType = patterns[group][cycle];
            
            let isWorkDay = false;
            if (shiftType === '中' && dayOfWeek >= 1 && dayOfWeek <= 5) isWorkDay = true;
            else if (shiftType === '早' && dayOfWeek >= 1 && dayOfWeek <= 6) isWorkDay = true;
            else if (shiftType === '夜' && dayOfWeek >= 2 && dayOfWeek <= 6) isWorkDay = true;

            return isWorkDay ? shiftType : "休";
        }

        // ===========================
        // UI 操作邏輯
        // ===========================

        const dateInput = document.getElementById('dateInput');
        const partSelect = document.getElementById('partSelect');
        const scheduleBody = document.getElementById('scheduleBody');
        const tableTitle = document.getElementById('tableTitle');

        // Modal 相關元素
        const modal = document.getElementById('detailModal');
        const modalBackdrop = document.getElementById('modalBackdrop');
        const modalPanel = document.getElementById('modalPanel');
        const modalTitle = document.getElementById('modalTitle');
        const modalShift = document.getElementById('modalShift');
        const modalAgent = document.getElementById('modalAgent');
        const modalHalf = document.getElementById('modalHalf');

        function formatDateStr(date) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        // 顯示 Modal
        function showModal(data) {
            modalTitle.textContent = `${data.dateStr} (${data.dayName})`;
            
            // 設定班別文字與顏色
            modalShift.textContent = data.shiftText === '休' ? '休假' : data.shiftText + '班';
            modalShift.className = `text-base font-bold px-2 py-0.5 rounded ${getShiftColorClass(data.shiftText)}`;
            
            modalAgent.textContent = data.agentText || '-';
            modalHalf.textContent = data.halfText || '-';

            // 顯示與動畫
            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modalBackdrop.classList.remove('opacity-0');
                modalPanel.classList.remove('opacity-0', 'scale-95');
                modalPanel.classList.add('opacity-100', 'scale-100');
            });
        }

        // 關閉 Modal
        function hideModal() {
            modalBackdrop.classList.add('opacity-0');
            modalPanel.classList.remove('opacity-100', 'scale-100');
            modalPanel.classList.add('opacity-0', 'scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function getShiftColorClass(shift) {
            if (shift === '早') return 'text-[#005f6b] dark:text-[#4fd1c5] bg-[#9dd7db]/20 dark:bg-[#005f6b]/30';
            if (shift === '中') return 'text-[#5c450a] dark:text-[#f6e05e] bg-[#ceb98d]/20 dark:bg-[#5c450a]/30';
            if (shift === '夜') return 'text-[#4a1f5c] dark:text-[#d6bcfa] bg-[#c6a1cf]/20 dark:bg-[#4a1f5c]/30';
            return 'text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-700';
        }

        function renderTable() {
            const dateVal = dateInput.value;
            if (!dateVal) return;

            const parts = dateVal.split('-');
            const selectedDate = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));

            // 強制從當週的星期日開始 (Sunday Start)
            const dayOfWeek = selectedDate.getDay();
            const startDate = new Date(selectedDate);
            startDate.setDate(selectedDate.getDate() - dayOfWeek);

            const selectedOption = partSelect.options[partSelect.selectedIndex];
            const partValue = selectedOption.value;
            const partName = selectedOption.text;

            tableTitle.textContent = `${partName} - 班表`;
            localStorage.setItem('partMemory', partValue);

            scheduleBody.innerHTML = '';
            
            const displayDate = new Date(startDate);

            for (let i = 0; i < 7; i++) {
                let shiftText = "";
                let agentText = "";
                let halfText = "";
                
                if (['0', '1', '2', '3'].includes(partValue)) {
                    const ordinalDate = getOrdinalDate(displayDate);
                    let nList = ordinalDate % 20;
                    
                    let offset = 0;
                    if (partValue === '0') offset = 18;
                    if (partValue === '1') offset = 3;
                    if (partValue === '2') offset = 8;
                    if (partValue === '3') offset = 13;
                    
                    nList = (nList + offset) % 20;
                    if (nList < 0) nList += 20;

                    shiftText = List[nList];
                    const pIndex = parseInt(partValue);
                    agentText = List1[pIndex][nList];
                    halfText = List2[pIndex][nList];
                } else {
                    shiftText = getEFGShift(displayDate, partValue);
                    agentText = "";
                    halfText = "";
                }

                const dayName = displayDate.toLocaleDateString("zh-TW", {weekday: 'long'});
                const dateStr = `${displayDate.getMonth() + 1}/${displayDate.getDate()}`;
                
                const today = new Date();
                const isToday = displayDate.toDateString() === today.toDateString();
                const todayClass = isToday ? 'bg-blue-50 dark:bg-blue-900/20' : '';

                const dayNum = displayDate.getDay();
                const dateColor = dayNum === 0 ? 'text-red-500 dark:text-red-400' : (dayNum === 6 ? 'text-blue-500 dark:text-blue-400' : 'text-slate-700 dark:text-slate-200');

                // 儲存資料供 Click 使用
                const rowData = {
                    dateStr: `${displayDate.getFullYear()}/${dateStr}`,
                    dayName: dayName,
                    shiftText: shiftText,
                    agentText: agentText,
                    halfText: halfText
                };

                const row = document.createElement('tr');
                row.className = `group hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors border-b border-slate-100 dark:border-slate-700 last:border-0 cursor-pointer ${todayClass}`;
                row.onclick = () => showModal(rowData);
                
                // 顯示請假代理
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-lg ${dateColor}">${dateStr}</span>
                            <span class="text-xs text-slate-500 dark:text-slate-400 font-medium px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 group-hover:bg-white dark:group-hover:bg-slate-600 transition-colors">${dayName}</span>
                            ${isToday ? '<span class="text-[10px] bg-blue-100 dark:bg-blue-900 text-blue-600 dark:text-blue-300 px-1.5 py-0.5 rounded font-bold">今天</span>' : ''}
                        </div>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <span class="shift-${shiftText} inline-flex items-center justify-center px-3 py-1 rounded-md text-sm font-bold min-w-[60px] shadow-sm transition-all">
                            ${shiftText === '休' ? '休假' : shiftText + '班'}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-center text-slate-600 dark:text-slate-400 font-medium">
                        ${agentText || '-'}
                    </td>
                `;

                scheduleBody.appendChild(row);
                
                displayDate.setDate(displayDate.getDate() + 1);
            }
        }

        // ===========================
        // 深色模式邏輯
        // ===========================
        const themeToggleBtn = document.getElementById('themeToggle');
        
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        themeToggleBtn.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        });

        // ===========================
        // 版權年份邏輯
        // ===========================
        function setCopyrightYear() {
            const startYear = 2024;
            const currentYear = new Date().getFullYear();
            const yearSpan = document.getElementById('copyrightYear');
            
            if (currentYear > startYear) {
                yearSpan.textContent = `${startYear}-${currentYear}`;
            } else {
                yearSpan.textContent = `${startYear}`;
            }
        }

        // ===========================
        // 事件與初始化
        // ===========================

        dateInput.addEventListener('change', renderTable);
        partSelect.addEventListener('change', renderTable);
        
        // Modal 事件
        document.getElementById('closeModalBtn').addEventListener('click', hideModal);
        document.getElementById('closeModalBtnBottom').addEventListener('click', hideModal);
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target.id === 'modalBackdrop' || e.target.id === 'detailModal') {
                hideModal();
            }
        });

        function init() {
            initTheme();
            setCopyrightYear(); // 設定版權年份

            const urlParams = new URLSearchParams(window.location.search);
            const dateParam = urlParams.get('date');
            if (dateParam) {
                dateInput.value = dateParam;
            } else {
                dateInput.value = formatDateStr(new Date());
            }

            const partParam = urlParams.get('part');
            const partMemory = localStorage.getItem('partMemory');

            if (partParam) {
                partSelect.value = partParam;
            } else if (partMemory) {
                const options = Array.from(partSelect.options).flatMap(opt => opt.options ? Array.from(opt.options) : opt).map(o => o.value);
                if (options.includes(partMemory)) {
                    partSelect.value = partMemory;
                }
            }

            renderTable();

            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            } else {
                setTimeout(() => {
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }, 500);
            }
        }

        document.getElementById('prevWeekBtn').addEventListener('click', () => {
            const parts = dateInput.value.split('-');
            const d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
            d.setDate(d.getDate() - 7);
            dateInput.value = formatDateStr(d);
            renderTable();
        });

        document.getElementById('nextWeekBtn').addEventListener('click', () => {
            const parts = dateInput.value.split('-');
            const d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
            d.setDate(d.getDate() + 7);
            dateInput.value = formatDateStr(d);
            renderTable();
        });

        init();
    </script>
</body>
</html>
